<style>

  .folder-picker-drive-icon {
    width: 34px;
    height: 34px;
    display: grid;
    place-items: center;
    flex: 0 0 auto;
    border-radius: 10px;
    background: #F1F5F9;
  }

  .folder-picker-drive-icon svg,
  .folder-address-icon svg,
  .folder-row-icon svg,
  .folder-empty-icon svg,
  .folder-back-button svg,
  .folder-row-open svg {
    width: 18px;
    height: 18px;
    display: block;
  }

  .folder-picker-toolbar {
    display: grid;
    grid-template-columns: auto minmax(0,1fr);
    gap: 10px;
    align-items: center;
    padding: 12px 22px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
  }

  .folder-back-button {
    height: 40px;
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 0 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--surface);
    color: var(--text);
    font: inherit;
    font-weight: 700;
    cursor: pointer;
    transition: background 140ms ease, border-color 140ms ease, transform 140ms ease;
  }

  .folder-back-button:hover:not(:disabled) {
    background: #F8FAFC;
    border-color: #CBD5E1;
    transform: translateY(-1px);
  }

  .folder-back-button:active:not(:disabled) {
    transform: translateY(0);
  }

  .folder-back-button:disabled {
    color: #94A3B8;
    background: #F8FAFC;
    cursor: not-allowed;
  }

  .folder-address {
    min-width: 0;
    height: 40px;
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 0 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: #F8FAFC;
    color: var(--text);
  }

  .folder-address-icon {
    color: #F59E0B;
    flex: 0 0 auto;
  }

  .folder-address-label {
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-size: 13.5px;
    font-weight: 700;
  }

  .folder-picker-body {
    min-height: 0;
    overflow: auto;
    padding: 18px 22px;
  }

  .folder-list {
    display: grid;
    gap: 8px;
    align-content: start;
  }

  .folder-row {
    width: 100%;
    display: grid;
    grid-template-columns: 36px minmax(0,1fr) 28px;
    gap: 12px;
    align-items: center;
    min-height: 58px;
    padding: 10px 12px;
    border: 1px solid transparent;
    border-radius: 8px;
    background: var(--surface);
    color: var(--text);
    font: inherit;
    text-align: left;
    cursor: pointer;
    box-shadow: 0 1px 2px rgba(15, 23, 42, 0.06);
    transition: background 140ms ease, border-color 140ms ease, transform 140ms ease, box-shadow 140ms ease;
  }

  .folder-row:hover {
    background: #EFF6FF;
    border-color: #BFDBFE;
    box-shadow: 0 8px 20px rgba(37, 99, 235, 0.12);
    transform: translateY(-1px);
  }

  .folder-row:focus-visible,
  .folder-back-button:focus-visible,
  .folder-select-button:focus-visible {
    outline: 3px solid rgba(37, 99, 235, 0.22);
    outline-offset: 2px;
  }

  .folder-row-icon {
    width: 36px;
    height: 36px;
    display: grid;
    place-items: center;
    border-radius: 8px;
    background: #FEF3C7;
    color: #D97706;
  }

  .folder-row-copy {
    min-width: 0;
    display: grid;
    gap: 2px;
  }

  .folder-row-copy strong {
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-size: 14px;
    color: var(--text);
  }

  .folder-row-copy span {
    font-size: 12px;
    color: var(--muted);
  }

  .folder-row-open {
    color: #64748B;
    justify-self: end;
    opacity: 0.75;
    transition: color 140ms ease, transform 140ms ease, opacity 140ms ease;
  }

  .folder-row:hover .folder-row-open {
    color: #2563EB;
    opacity: 1;
    transform: translateX(2px);
  }

  .folder-picker-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    padding: 14px 22px;
    background: var(--surface);
    border-top: 1px solid var(--border);
    box-shadow: 0 -10px 24px rgba(15, 23, 42, 0.06);
  }

  .folder-selected-summary {
    min-width: 0;
    display: grid;
    gap: 2px;
  }

  .folder-selected-label {
    font-size: 12px;
    font-weight: 700;
    color: var(--muted);
  }

  .folder-selected-summary strong {
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-size: 14px;
    color: var(--text);
  }

  .folder-select-button {
    min-width: 142px;
    height: 42px;
    justify-content: center;
  }

  .folder-empty-state {
    min-height: 260px;
    display: grid;
    place-items: center;
    align-content: center;
    gap: 8px;
    color: var(--muted);
    text-align: center;
  }

  .folder-empty-icon {
    width: 48px;
    height: 48px;
    display: grid;
    place-items: center;
    border-radius: 12px;
    background: #FEF3C7;
    color: #D97706;
    margin-bottom: 4px;
  }

  .folder-empty-icon svg {
    width: 25px;
    height: 25px;
  }

  .folder-empty-state strong {
    color: var(--text);
    font-size: 15px;
  }

  .folder-empty-state span:last-child {
    font-size: 13px;
  }

  .folder-row-skeleton {
    cursor: default;
    pointer-events: none;
  }

  .folder-skeleton-icon {
    width: 36px;
    height: 36px;
  }

  .folder-skeleton-name {
    width: min(260px, 70%);
    height: 14px;
  }

  .folder-skeleton-action {
    width: 24px;
    height: 24px;
    justify-self: end;
  }

/*  */

  @keyframes spin    { to { transform: rotate(360deg); } }
  @keyframes shimmer {
    0%   { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }

/*  */
  .skeleton {
    border-radius: var(--radius);
    background: linear-gradient(90deg, #F3F4F6 25%, #E5E7EB 50%, #F3F4F6 75%);
    background-size: 400% 100%;
    animation: shimmer 1.4s ease infinite;
  }

/*  */

  @media (max-width: 1100px) {
    .process-source-grid { grid-template-columns: 1fr; }
    .grid-4 { grid-template-columns: repeat(3, minmax(0,1fr)); }
    .metadata-grid { grid-template-columns: repeat(3, minmax(0,1fr)); }
    .process-card .metadata-grid { grid-template-columns: repeat(3, minmax(0,1fr)); }
    .activities-grid { grid-template-columns: repeat(3, minmax(0,1fr)); }
    .subs-grid { grid-template-columns: repeat(3, minmax(0,1fr)); }
    .folders-grid { grid-template-columns: repeat(3, minmax(0,1fr)); }
    .stepper { flex-wrap: wrap; }
    .step { flex: 1 0 auto; border-right: none; border-bottom: 1px solid var(--border); }
    .step:last-child { border-bottom: 0; }
  }

  @media (max-width: 900px) {
    .grid-4 { grid-template-columns: repeat(2, minmax(0,1fr)); }
    .activities-grid { grid-template-columns: repeat(2, minmax(0,1fr)); }
    .subs-grid { grid-template-columns: repeat(2, minmax(0,1fr)); }
    .folders-grid { grid-template-columns: repeat(2, minmax(0,1fr)); }
    .template-category-grid { grid-template-columns: repeat(2, minmax(0,1fr)); }
    .metadata-grid { grid-template-columns: repeat(2, minmax(0,1fr)); }
    .process-card .metadata-grid { grid-template-columns: repeat(2, minmax(0,1fr)); }
  }

  /* COMPACT STAT ROW (secondary, dashboard top) */

  .stat-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 28px;
  }

  .stat-chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 13px;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: var(--surface);
    color: var(--muted);
    font-size: 12.5px;
    font-weight: 500;
    box-shadow: var(--shadow-xs);
  }

  .stat-chip-num {
    font-weight: 700;
    font-size: 14px;
    color: var(--text);
  }

  .stat-chip-lbl { color: var(--muted); }

  .stat-chip-ok  { color: var(--ok);   border-color: var(--ok-border);   background: var(--ok-bg); }
  .stat-chip-ok  .stat-chip-num { color: var(--ok); }

  .stat-chip-warn { color: var(--warn); border-color: var(--warn-border); background: var(--warn-bg); }
  .stat-chip-warn .stat-chip-num { color: var(--warn); }

  /* ACTIVITIES HERO SECTION (Dashboard) */

  .activities-section { margin-top: 8px; }

  .activities-heading {
    font-size: 19px;
    font-weight: 700;
    letter-spacing: -0.02em;
    color: var(--text);
    margin-bottom: 4px;
  }

  .activities-sub {
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 18px;
  }

  .activities-grid {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 16px;
  }

  .subs-grid {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 16px;
  }

  .folders-grid {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 16px;
    margin-bottom: 24px;
  }

  /* TALL PORTRAIT CARD REDESIGN (Glassmorphism & Glossy) */

  .tall-card {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    text-align: center;
    padding: 26px 20px;
    border-radius: var(--radius-lg);
    cursor: pointer;
    overflow: hidden;
    box-shadow: 0 8px 30px rgba(var(--tc-primary-rgb), 0.08), inset 0 1px 1.5px rgba(255, 255, 255, 0.7);
    transition: transform 220ms cubic-bezier(0.34, 1.56, 0.64, 1), 
                box-shadow 220ms ease, 
                border-color 220ms ease;
    min-height: 400px;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    
    /* Default light glass theme */
    background: linear-gradient(135deg, rgba(255, 255, 255, 0.75) 0%, rgba(255, 255, 255, 0.45) 100%);
    border: 1.5px solid rgba(255, 255, 255, 0.45);
    color: var(--text);
  }

  /* Background image layer for tall card */
  .tall-card-bg {
    position: absolute;
    inset: 0;
    background-size: contain;
    background-position: center bottom;
    background-repeat: no-repeat;
    opacity: 0.15;
    z-index: 1; /* Raise z-index slightly to ensure it's not hidden by anything */
    pointer-events: none;
    border-radius: inherit;
  }

  /* Ornamen background for panels */
  .panel-ornamen-bg {
    position: absolute;
    inset: 0;
    background-size: 350px;
    background-position: bottom right;
    background-repeat: no-repeat;
    opacity: 0.15;
    z-index: 0;
    pointer-events: none;
    border-radius: inherit;
    overflow: hidden;
  }

  /* Theme variables configurations */
  :root {
    --color-kepemimpinan-start: #34D399;
    --color-kepemimpinan-end: #10B981;
    --color-kepemimpinan-border: #059669;
    --color-kepemimpinan-rgb: 5, 150, 105;
    --color-kepemimpinan-text: #064E3B;

    --color-latsar-start: #FB7185;
    --color-latsar-end: #F43F5E;
    --color-latsar-border: #E11D48;
    --color-latsar-rgb: 225, 29, 72;
    --color-latsar-text: #881337;

    --color-teknis-start: #FBBF24;
    --color-teknis-end: #F59E0B;
    --color-teknis-border: #D97706;
    --color-teknis-rgb: 217, 119, 6;
    --color-teknis-text: #78350F;

    --color-lain-start: #A78BFA;
    --color-lain-end: #8B5CF6;
    --color-lain-border: #7C3AED;
    --color-lain-rgb: 124, 58, 237;
    --color-lain-text: #4C1D95;
  }

  .theme-sleek {
    --color-kepemimpinan-start: #34D399;
    --color-kepemimpinan-end: #10B981;
    --color-kepemimpinan-border: #059669;
    --color-kepemimpinan-rgb: 5, 150, 105;
    --color-kepemimpinan-text: #064E3B;

    --color-latsar-start: #FB7185;
    --color-latsar-end: #F43F5E;
    --color-latsar-border: #E11D48;
    --color-latsar-rgb: 225, 29, 72;
    --color-latsar-text: #881337;

    --color-teknis-start: #FBBF24;
    --color-teknis-end: #F59E0B;
    --color-teknis-border: #D97706;
    --color-teknis-rgb: 217, 119, 6;
    --color-teknis-text: #78350F;

    --color-lain-start: #A78BFA;
    --color-lain-end: #8B5CF6;
    --color-lain-border: #7C3AED;
    --color-lain-rgb: 124, 58, 237;
    --color-lain-text: #4C1D95;
  }

  .theme-earthy {
    --color-kepemimpinan-start: #A7F3D0;
    --color-kepemimpinan-end: #059669;
    --color-kepemimpinan-border: #065F46;
    --color-kepemimpinan-rgb: 6, 95, 70;
    --color-kepemimpinan-text: #022C22;

    --color-latsar-start: #FFEDD5;
    --color-latsar-end: #C2410C;
    --color-latsar-border: #9A3412;
    --color-latsar-rgb: 154, 52, 18;
    --color-latsar-text: #431407;

    --color-teknis-start: #FEF08A;
    --color-teknis-end: #A16207;
    --color-teknis-border: #854D0E;
    --color-teknis-rgb: 133, 77, 14;
    --color-teknis-text: #422006;

    --color-lain-start: #E9D5FF;
    --color-lain-end: #7E22CE;
    --color-lain-border: #6B21A8;
    --color-lain-rgb: 107, 33, 168;
    --color-lain-text: #3B0764;
  }

  .theme-nordic {
    --color-kepemimpinan-start: #A5F3FC;
    --color-kepemimpinan-end: #0891B2;
    --color-kepemimpinan-border: #0E7490;
    --color-kepemimpinan-rgb: 14, 116, 144;
    --color-kepemimpinan-text: #083344;

    --color-latsar-start: #FCE7F3;
    --color-latsar-end: #BE185D;
    --color-latsar-border: #9D174D;
    --color-latsar-rgb: 157, 23, 77;
    --color-latsar-text: #500724;

    --color-teknis-start: #FEF3C7;
    --color-teknis-end: #B45309;
    --color-teknis-border: #78350F;
    --color-teknis-rgb: 120, 53, 15;
    --color-teknis-text: #451A03;

    --color-lain-start: #C7D2FE;
    --color-lain-end: #4338CA;
    --color-lain-border: #312E81;
    --color-lain-rgb: 49, 46, 129;
    --color-lain-text: #1E1B4B;
  }

  /* Theme categories for tall-card */
  .tall-card-kepemimpinan {
    --tc-primary: var(--color-kepemimpinan-border);
    --tc-primary-rgb: var(--color-kepemimpinan-rgb);
    --tc-text-dark: var(--color-kepemimpinan-text);
    background: linear-gradient(135deg, var(--color-kepemimpinan-start) 0%, var(--color-kepemimpinan-end) 100%);
    border: 1.5px solid var(--color-kepemimpinan-border);
  }

  .tall-card-latsar_cpns {
    --tc-primary: var(--color-latsar-border);
    --tc-primary-rgb: var(--color-latsar-rgb);
    --tc-text-dark: var(--color-latsar-text);
    background: linear-gradient(135deg, var(--color-latsar-start) 0%, var(--color-latsar-end) 100%);
    border: 1.5px solid var(--color-latsar-border);
  }

  .tall-card-teknis {
    --tc-primary: var(--color-teknis-border);
    --tc-primary-rgb: var(--color-teknis-rgb);
    --tc-text-dark: var(--color-teknis-text);
    background: linear-gradient(135deg, var(--color-teknis-start) 0%, var(--color-teknis-end) 100%);
    border: 1.5px solid var(--color-teknis-border);
  }

  .tall-card-lain_lain {
    --tc-primary: var(--color-lain-border);
    --tc-primary-rgb: var(--color-lain-rgb);
    --tc-text-dark: var(--color-lain-text);
    background: linear-gradient(135deg, var(--color-lain-start) 0%, var(--color-lain-end) 100%);
    border: 1.5px solid var(--color-lain-border);
  }

  .panel.tall-card-kepemimpinan,
  .panel.tall-card-latsar_cpns,
  .panel.tall-card-teknis,
  .panel.tall-card-lain_lain {
    background: var(--surface);
    border: 1px solid var(--border);
  }

  .tall-card-kepemimpinan { --tc-border: var(--color-kepemimpinan-border); }
  .tall-card-latsar_cpns { --tc-border: var(--color-latsar-cpns-border); }
  .tall-card-teknis { --tc-border: var(--color-teknis-border); }
  .tall-card-lain_lain { --tc-border: var(--color-lain-lain-border); }

  /* Theme Selection UI Styles */
  .theme-options-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 16px;
    margin-top: 8px;
  }

  .theme-option-card {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px;
    border: 2px solid var(--border);
    border-radius: var(--radius-lg);
    cursor: pointer;
    background: var(--surface);
    transition: border-color 140ms ease, box-shadow 140ms ease, transform 140ms ease;
  }

  .theme-option-card:hover {
    border-color: var(--accent-mid);
    background: var(--surface-hover);
    transform: translateY(-2px);
  }

  .theme-option-card.active {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.18);
    background: var(--accent-light);
  }

  .theme-option-preview {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 4px;
    width: 44px;
    height: 44px;
    padding: 4px;
    border-radius: var(--radius);
    background: var(--surface-soft);
    border: 1px solid var(--border);
    flex-shrink: 0;
  }

  .preview-dot {
    width: 100%;
    height: 100%;
    border-radius: 3px;
  }

  .theme-option-info {
    display: flex;
    flex-direction: column;
    gap: 2px;
    min-width: 0;
  }

  .theme-option-info strong {
    font-size: 13.5px;
    font-weight: 700;
    color: var(--text);
  }

  .theme-option-info span {
    font-size: 11.5px;
    color: var(--muted);
    line-height: 1.4;
  }

  /* Default/fallback tall-card */
  .tall-card:where(:not([class*="-kepemimpinan"]):not([class*="-latsar_cpns"]):not([class*="-teknis"]):not([class*="-lain_lain"])) {
    --tc-primary: #2563EB;
    --tc-primary-rgb: 37, 99, 235;
    --tc-text-dark: #1E3A8A;
    background: linear-gradient(135deg, #60A5FA 0%, #3B82F6 100%);
    border: 1.5px solid #2563EB;
  }

  /* Hover and active states */
  .tall-card:hover {
    box-shadow: 0 16px 40px rgba(var(--tc-primary-rgb), 0.18), inset 0 1px 1px rgba(255, 255, 255, 0.8);
    transform: translateY(-6px) scale(1.02);
    border-color: rgba(var(--tc-primary-rgb), 0.75);
  }

  .tall-card:active {
    transform: translateY(-1px) scale(0.985);
  }

  /* Ensure card with open dropdown is stacked above other cards in the grid and allows dropdown to overflow */
  .tall-card:has(.sub-dropdown-menu.open),
  .tall-card.dropdown-open {
    z-index: 10;
    overflow: visible;
  }

  /* Glossy sheen reflection */
  .tall-card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 40%;
    background: linear-gradient(to bottom, rgba(255, 255, 255, 0.35) 0%, rgba(255, 255, 255, 0) 100%);
    pointer-events: none;
    z-index: 1;
  }

  /* Hover sweep animation */
  .tall-card::after {
    content: '';
    position: absolute;
    top: 0;
    left: -150%;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, rgba(255, 255, 255, 0) 0%, rgba(255, 255, 255, 0.25) 50%, rgba(255, 255, 255, 0) 100%);
    transform: skewX(-25deg);
    transition: left 750ms cubic-bezier(0.2, 0.8, 0.2, 1);
    pointer-events: none;
    z-index: 1;
  }

  .tall-card:hover::after {
    left: 150%;
  }

  /* Layout Components Inside Tall Card */
  .tall-card-top {
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    z-index: 3; /* Raise z-index above middle section to prevent dropdown from rendering under card folder icon */
    flex-shrink: 0;
    position: relative;
  }

  .tall-card-top > .tall-card-actions-top {
    position: absolute;
    top: 0;
    right: 0;
    width: auto;
    z-index: 10;
  }

  .tall-card-header-row {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
    width: 100%;
  }

  .tall-card-badge {
    font-size: 11px;
    font-weight: 700;
    padding: 3px 10px;
    border-radius: 999px;
    letter-spacing: 0.04em;
    background: rgba(var(--tc-primary-rgb), 0.2);
    color: var(--tc-text-dark);
    text-transform: uppercase;
    box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.4);
  }

  .tall-card-metadata {
    font-size: 11.5px;
    font-weight: 600;
    color: var(--tc-text-dark);
