<script>
  function showLoginModal() {
    const backdrop = document.createElement('div');
    backdrop.className = 'modal-backdrop';
    backdrop.id = 'login-modal-backdrop';
    backdrop.style.backdropFilter = 'blur(6px)';
    backdrop.style.background = 'rgba(15,23,42,0.55)';
    backdrop.innerHTML = `
      <div class="modal-card" style="max-width:400px;overflow:visible;">
        <div class="login-bar"></div>
        <div style="padding:28px 28px 24px;">
          <div style="text-align:center;margin-bottom:22px;">
            <div style="width:48px;height:48px;border-radius:999px;background:linear-gradient(135deg,var(--accent-light),#DBEAFE);display:inline-grid;place-items:center;border:2px solid var(--accent-border);margin-bottom:14px;">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
              </svg>
            </div>
            <h2 style="font-size:18px;font-weight:700;color:var(--text);letter-spacing:-0.02em;line-height:1.3;margin:0 0 4px;">Masuk ke Portal Arsip</h2>
            <p style="font-size:13px;color:var(--muted);margin:0;line-height:1.4;">Masukkan kredensial akun Anda.</p>
          </div>

          <div id="login-error" style="display:none;align-items:center;gap:9px;padding:11px 14px;border-radius:var(--radius);background:var(--danger-bg);border:1px solid var(--danger-border);margin-bottom:18px;font-size:13px;font-weight:600;color:var(--danger);line-height:1.4;">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;">
              <circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/>
            </svg>
            <span id="login-error-text"></span>
          </div>

          <div style="display:grid;gap:16px;">
            <div style="display:grid;gap:6px;">
              <label style="font-size:11.5px;font-weight:700;color:var(--text);letter-spacing:0.005em;">Nama Pengguna</label>
              <div style="position:relative;display:flex;align-items:center;">
                <svg style="position:absolute;left:12px;color:var(--subtle);pointer-events:none;flex-shrink:0;transition:color 140ms ease;" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                  <circle cx="12" cy="7" r="4"/>
                </svg>
                <input id="login-username" type="text" autocomplete="username" placeholder="admin" autocapitalize="off" style="width:100%;border:1.5px solid var(--border);border-radius:var(--radius);min-height:44px;padding:8px 12px 8px 38px;background:var(--surface);color:var(--text);font-size:14px;line-height:1.5;transition:border-color 140ms ease,box-shadow 140ms ease;">
              </div>
            </div>

            <div style="display:grid;gap:6px;">
              <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;">
                <label style="font-size:11.5px;font-weight:700;color:var(--text);letter-spacing:0.005em;">Kata Sandi</label>
              </div>
              <div style="position:relative;display:flex;align-items:center;">
                <svg style="position:absolute;left:12px;color:var(--subtle);pointer-events:none;flex-shrink:0;transition:color 140ms ease;" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                  <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                </svg>
                <input id="login-password" type="password" autocomplete="current-password" placeholder="kata sandi" style="width:100%;border:1.5px solid var(--border);border-radius:var(--radius);min-height:44px;padding:8px 12px 8px 38px;background:var(--surface);color:var(--text);font-size:14px;line-height:1.5;transition:border-color 140ms ease,box-shadow 140ms ease;">
                <button id="login-pw-toggle" type="button" tabindex="-1" aria-label="Tampilkan kata sandi" style="position:absolute;right:6px;width:32px;height:32px;border-radius:var(--radius);display:grid;place-items:center;border:1px solid transparent;background:transparent;color:var(--subtle);cursor:pointer;transition:all 120ms ease;flex-shrink:0;">
                  <svg class="login-pw-eye" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                    <circle cx="12" cy="12" r="3"/>
                  </svg>
                  <svg class="login-pw-eye-off" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;">
                    <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                    <line x1="1" y1="1" x2="23" y2="23"/>
                  </svg>
                </button>
              </div>
            </div>
          </div>

          <button id="login-btn" style="display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:11px 22px;min-height:44px;margin-top:20px;border:none;border-radius:var(--radius);background:var(--accent);color:#fff;font-size:14px;font-weight:700;cursor:pointer;transition:all 140ms ease;box-shadow:0 1px 3px rgba(29,78,216,0.25);position:relative;line-height:1.25;font-family:inherit;">
            <span id="login-btn-text">Masuk</span>
            <div id="login-spinner" style="display:none;position:absolute;inset:0;align-items:center;justify-content:center;gap:5px;">
              <div style="width:6px;height:6px;border-radius:999px;background:rgba(255,255,255,0.7);animation:lgnDot 0.6s ease-in-out infinite;"></div>
              <div style="width:6px;height:6px;border-radius:999px;background:rgba(255,255,255,0.7);animation:lgnDot 0.6s ease-in-out infinite;animation-delay:0.15s;"></div>
              <div style="width:6px;height:6px;border-radius:999px;background:rgba(255,255,255,0.7);animation:lgnDot 0.6s ease-in-out infinite;animation-delay:0.3s;"></div>
            </div>
          </button>
        </div>
        <div style="padding:14px 28px;border-top:1px solid var(--line);text-align:center;">
          <a id="login-reset-admin" href="#" style="display:block;font-size:12px;color:var(--accent);font-weight:600;margin-bottom:8px;cursor:pointer;text-decoration:none;">Lupa kata sandi admin? Reset (khusus pemilik workspace)</a>
          <span style="font-size:12px;color:var(--subtle);font-weight:500;">Portal Arsip PUSJARSKPP LAN RI</span>
        </div>
      </div>
    `;
    document.body.appendChild(backdrop);

    const style = document.createElement('style');
    style.textContent = `
      @keyframes lgnDot { 0%,80%,100% { transform:scale(0.6); opacity:0.4; } 40% { transform:scale(1); opacity:1; } }
    `;
    document.head.appendChild(style);

    const inputs = backdrop.querySelectorAll('input');
    inputs.forEach(inp => {
      inp.addEventListener('focus', () => {
        const wrap = inp.closest('div[style*="position:relative"]');
        if (wrap) {
          wrap.querySelector('svg')?.style.setProperty('color', 'var(--accent-mid)');
          inp.style.borderColor = 'var(--accent-mid)';
          inp.style.boxShadow = '0 0 0 3px rgba(59,130,246,0.12)';
        }
      });
      inp.addEventListener('blur', () => {
        const wrap = inp.closest('div[style*="position:relative"]');
        if (wrap) {
          wrap.querySelector('svg')?.style.setProperty('color', 'var(--subtle)');
          inp.style.borderColor = '';
          inp.style.boxShadow = '';
        }
      });
    });

    const pwToggle = backdrop.querySelector('#login-pw-toggle');
    const pwInput = backdrop.querySelector('#login-password');
    pwToggle.addEventListener('click', () => {
      const isPw = pwInput.type === 'password';
      pwInput.type = isPw ? 'text' : 'password';
      pwToggle.querySelector('.login-pw-eye').style.display = isPw ? 'none' : '';
      pwToggle.querySelector('.login-pw-eye-off').style.display = isPw ? '' : 'none';
    });

    const close = () => { backdrop.remove(); style.remove(); state._loginPromptShown = false; };
    backdrop.querySelector('#login-modal-close')?.addEventListener('click', close);
    backdrop.addEventListener('click', (e) => { if (e.target === backdrop) close(); });

    // Pemulihan: pemilik workspace yang lupa/tak punya kata sandi admin bisa reset & dapat
    // kata sandi baru. Server batasi ke pemilik (Session.getActiveUser == owner file).
    const resetLink = backdrop.querySelector('#login-reset-admin');
    if (resetLink) {
      resetLink.addEventListener('click', async (e) => {
        e.preventDefault();
        if (!confirm('Reset kata sandi admin? Hanya pemilik workspace yang bisa. Kata sandi admin lama tidak akan berlaku lagi.')) return;
        const label = resetLink.textContent;
        resetLink.textContent = 'Memproses reset...';
        resetLink.style.pointerEvents = 'none';
        try {
          const r = await api('forceResetAdmin', {});
          close();
          showAdminPasswordModal(r.password);
        } catch (err) {
          resetLink.textContent = label;
          resetLink.style.pointerEvents = '';
          showToast('Gagal reset: ' + (err.message || String(err)));
        }
      });
    }

    const doLogin = async () => {
      const username = document.getElementById('login-username')?.value.trim();
      const password = document.getElementById('login-password')?.value;
      const errorEl = document.getElementById('login-error');
      const errorText = document.getElementById('login-error-text');
      if (!username || !password) {
        if (errorEl && errorText) {
          errorText.textContent = 'Nama pengguna dan kata sandi wajib diisi.';
          errorEl.style.display = 'flex';
        }
        return;
      }
      const btn = document.getElementById('login-btn');
      const btnText = document.getElementById('login-btn-text');
      const spinner = document.getElementById('login-spinner');
      if (btn) { btn.disabled = true; }
      if (btnText) btnText.style.opacity = '0';
      if (spinner) spinner.style.display = 'flex';
      if (errorEl) errorEl.style.display = 'none';
      try {
        const user = await api('login', { username, password });
        if (user.sessionId) {
          localStorage.setItem('portal_session_id', user.sessionId);
        }
        state.currentUser = user;
        close();
        state._loginPromptShown = false;

        // Immediately update sidebar visibility and user bar so there's no visual gap
        applyRoleVisibility();
        renderLogoutBar();
        updateNavActive();

        // Force a fresh bootstrap re-fetch (old one was loaded as guest)
        state.bootstrap = null;
        
        // Populate nav again to show skeleton state while waiting
        populateDashboardNav();

        // Show loading indicator in content area while refreshing data
        showLoading('Menyiapkan sesi Anda...');

        invalidateViewCache();
        await loadBootstrap();
      } catch (e) {
        if (errorEl && errorText) {
          errorText.textContent = e.message || 'Login gagal.';
          errorEl.style.display = 'flex';
        }
      } finally {
        if (btn) { btn.disabled = false; }
        if (btnText) btnText.style.opacity = '1';
        if (spinner) spinner.style.display = 'none';
      }
    };

    backdrop.querySelector('#login-btn').onclick = doLogin;
    backdrop.querySelector('#login-password').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') doLogin();
    });
    setTimeout(() => backdrop.querySelector('#login-username').focus(), 80);
  }

  function renderLogoutBar() {
    const user = state.currentUser || { role: 'guest', displayName: '', username: '' };
    const footer = document.getElementById('sidebar-footer');
    if (!footer) return;
    
    const name = user.displayName || user.username || 'Tamu';
    const initial = name.charAt(0).toUpperCase();

    if (user.role === 'guest') {
      footer.innerHTML = `
        <div class="logout-bar">
          <div class="user-avatar guest-avatar">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
              <circle cx="12" cy="7" r="4"/>
            </svg>
          </div>
          <div class="user-info">
            <strong>Tamu</strong>
            <span class="user-role">Tamu</span>
          </div>
          <button class="btn-login-action" id="login-btn-guest" aria-label="Masuk" title="Masuk">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
              <polyline points="10 17 15 12 10 7"/>
              <line x1="15" y1="12" x2="3" y2="12"/>
            </svg>
          </button>
        </div>
      `;
      document.getElementById('login-btn-guest')?.addEventListener('click', showLoginModal);
      return;
    }
    
    const roleText = user.role === 'admin' ? 'Administrator' : (user.role === 'user' ? 'Operator' : 'Tamu');
    footer.innerHTML = `
      <div class="logout-bar">
        <div class="user-avatar">
          ${initial}
        </div>
        <div class="user-info">
          <strong>${esc(name)}</strong>
          <span class="user-role">${esc(roleText)}</span>
        </div>
        <button class="btn-logout-action" id="logout-btn" aria-label="Keluar" title="Keluar">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
            <polyline points="16 17 21 12 16 7"/>
            <line x1="21" y1="12" x2="9" y2="12"/>
          </svg>
        </button>
      </div>
    `;
    document.getElementById('logout-btn')?.addEventListener('click', doLogout);
  }

  async function doLogout() {
    const btn = document.getElementById('logout-btn');
    if (btn) {
      btn.disabled = true;
      btn.innerHTML = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="animation: spin 1s linear infinite;"><line x1="12" y1="2" x2="12" y2="6"/><line x1="12" y1="18" x2="12" y2="22"/><line x1="4.93" y1="4.93" x2="7.76" y2="7.76"/><line x1="16.24" y1="16.24" x2="19.07" y2="19.07"/><line x1="2" y1="12" x2="6" y2="12"/><line x1="18" y1="12" x2="22" y2="12"/><line x1="4.93" y1="19.07" x2="7.76" y2="16.24"/><line x1="16.24" y1="4.93" x2="19.07" y2="7.76"/></svg>';
      btn.style.opacity = '0.7';
    }
    showLoading('Sedang keluar...');
    try {
      await api('logout');
    } catch (e) { /* ignore */ }
    localStorage.removeItem('portal_session_id');
    state.currentUser = { role: 'guest', username: '', displayName: 'Tamu' };
    state._loginPromptShown = false;

    // Immediately reflect guest state in sidebar
    applyRoleVisibility();
    renderLogoutBar();
    updateNavActive();
    showToast('Berhasil logout.');

    // Force fresh bootstrap re-fetch
    showLoading('Memuat ulang...');
    state.bootstrap = null;
    invalidateViewCache();
    await loadBootstrap();
  }

  function showAdminPasswordModal(password) {
    const backdrop = document.createElement('div');
    backdrop.className = 'modal-backdrop';
    backdrop.style.backdropFilter = 'blur(6px)';
    backdrop.style.background = 'rgba(15,23,42,0.55)';
    backdrop.innerHTML = `
      <div class="modal-card" style="max-width:440px;overflow:visible;">
        <div class="login-bar"></div>
        <div style="padding:28px 28px 24px;">
          <div style="text-align:center;margin-bottom:22px;">
            <div style="width:48px;height:48px;border-radius:999px;background:linear-gradient(135deg,#FEF3C7,#FDE68A);display:inline-grid;place-items:center;border:2px solid #FCD34D;margin-bottom:14px;">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#D97706" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
              </svg>
            </div>
            <h2 style="font-size:18px;font-weight:700;color:var(--text);letter-spacing:-0.02em;line-height:1.3;margin:0 0 4px;">Akun Admin Dibuat</h2>
            <p style="font-size:13px;color:var(--muted);margin:0;line-height:1.4;">Catat kredensial ini. Hanya ditampilkan sekali.</p>
          </div>

          <div style="display:grid;gap:12px;">
            <div style="display:flex;align-items:center;gap:12px;padding:13px 16px;border-radius:var(--radius-md);background:var(--surface-soft);border:1px solid var(--border);">
              <div style="width:36px;height:36px;border-radius:var(--radius);background:var(--accent-light);color:var(--accent);display:grid;place-items:center;flex-shrink:0;">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                  <circle cx="12" cy="7" r="4"/>
                </svg>
              </div>
              <div>
        <div style="font-size:11px;font-weight:500;color:var(--subtle);line-height:1.3;">Nama Pengguna</div>
        <strong style="font-size:15px;color:var(--text);line-height:1.3;">admin</strong>
              </div>
            </div>

            <div style="display:flex;align-items:center;gap:12px;padding:13px 16px;border-radius:var(--radius-md);background:#FFFBEB;border:1px solid #FDE68A;">
              <div style="width:36px;height:36px;border-radius:var(--radius);background:#FEF3C7;color:#D97706;display:grid;place-items:center;flex-shrink:0;">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                  <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                </svg>
              </div>
              <div>
                <div style="font-size:11px;font-weight:500;color:var(--subtle);line-height:1.3;">Kata Sandi</div>
                <strong style="font-size:15px;color:var(--text);line-height:1.3;font-family:'Courier New',monospace;">${esc(password)}</strong>
              </div>
            </div>
          </div>

          <p style="display:flex;align-items:center;gap:6px;margin:16px 0 0;font-size:12px;font-weight:600;color:var(--danger);line-height:1.4;">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;">
              <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
              <line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>
            </svg>
            Kata sandi tidak bisa ditampilkan lagi setelah dialog ditutup.
          </p>

          <button id="admin-pw-close" style="display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:11px 22px;min-height:44px;margin-top:18px;border:none;border-radius:var(--radius);background:var(--accent);color:#fff;font-size:14px;font-weight:700;cursor:pointer;transition:all 140ms ease;box-shadow:0 1px 3px rgba(29,78,216,0.25);font-family:inherit;">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="20 6 9 17 4 12"/>
            </svg>
            Saya Sudah Mencatat
          </button>
        </div>
      </div>
    `;
    document.body.appendChild(backdrop);
    backdrop.querySelector('#admin-pw-close').onclick = () => backdrop.remove();
    backdrop.addEventListener('click', (e) => { if (e.target === backdrop) backdrop.remove(); });
  }
</script>
