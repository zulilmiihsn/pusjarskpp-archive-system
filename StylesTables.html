<style>

  .acc-row-right {
    display: flex;
    align-items: center;
    gap: 4px;
    flex-shrink: 0;
    opacity: 0;
    transition: opacity 120ms ease;
  }

  .acc-row:hover .acc-row-right {
    opacity: 1;
  }

  .acc-row-btn {
    width: 32px;
    height: 32px;
    border-radius: var(--radius);
    display: grid;
    place-items: center;
    border: 1px solid transparent;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    transition: all 120ms ease;
    flex-shrink: 0;
  }

  .acc-row-btn:hover {
    background: var(--surface);
    border-color: #D1D5DB;
    color: var(--text);
    box-shadow: var(--shadow-xs);
  }

  .acc-row-btn-danger:hover {
    background: var(--danger-bg);
    border-color: var(--danger-border);
    color: var(--danger);
  }

  .acc-row-btn:disabled {
    opacity: 0.4;
    pointer-events: none;
  }

  .accounts-avatar {
    width: 36px;
    height: 36px;
    border-radius: 999px;
    display: grid;
    place-items: center;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: -0.01em;
    flex-shrink: 0;
    line-height: 1;
    text-transform: uppercase;
  }

  .accounts-avatar-admin {
    background: linear-gradient(135deg, #EFF6FF, #DBEAFE);
    color: var(--accent);
    border: 1.5px solid var(--accent-border);
  }

  .accounts-avatar-user {
    background: var(--surface-soft);
    color: var(--muted);
    border: 1.5px solid var(--border);
  }

  .accounts-user-name {
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
    line-height: 1.3;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .accounts-user-display {
    font-size: 12px;
    font-weight: 500;
    color: var(--muted);
    line-height: 1.3;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .accounts-empty {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    padding: 48px 24px;
    gap: 6px;
  }

  .accounts-empty-icon {
    width: 52px;
    height: 52px;
    border-radius: var(--radius-md);
    background: var(--surface-soft);
    color: var(--subtle);
    display: grid;
    place-items: center;
    margin-bottom: 6px;
  }

  .accounts-empty strong {
    font-size: 15px;
    color: var(--text);
  }

  .accounts-empty p {
    font-size: 13px;
    color: var(--muted);
    max-width: 300px;
    line-height: 1.6;
  }

  .accounts-loading {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 36px 20px;
    color: var(--muted);
    font-size: 13.5px;
    font-weight: 500;
  }

/* ── Premium Account Modal ── */

  .acc-modal-card {
    max-width: 480px;
    overflow: visible;
  }

  .acc-modal-bar {
    height: 3px;
    background: linear-gradient(90deg, var(--accent), var(--accent-mid));
    flex-shrink: 0;
  }

  .acc-modal-head {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 14px;
    padding: 18px 22px 0;
    flex-shrink: 0;
  }

  .acc-modal-head-left {
    display: flex;
    align-items: center;
    gap: 13px;
  }

  .acc-modal-head-icon {
    width: 38px;
    height: 38px;
    border-radius: var(--radius-md);
    background: linear-gradient(135deg, var(--accent-light), #DBEAFE);
    color: var(--accent);
    display: grid;
    place-items: center;
    flex-shrink: 0;
    border: 1px solid var(--accent-border);
  }

  .acc-modal-title {
    font-size: 16px;
    font-weight: 700;
    color: var(--text);
    letter-spacing: -0.01em;
    line-height: 1.3;
  }

  .acc-modal-sub {
    font-size: 12.5px;
    color: var(--muted);
    font-weight: 400;
    margin-top: 1px;
    line-height: 1.4;
  }

  .acc-modal-close {
    width: 32px;
    height: 32px;
    border-radius: var(--radius);
    display: grid;
    place-items: center;
    border: 1px solid transparent;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    flex-shrink: 0;
    transition: all 120ms ease;
  }

  .acc-modal-close:hover {
    background: var(--surface-hover);
    color: var(--text);
    border-color: var(--border);
  }

  .acc-modal-body {
    padding: 18px 22px 4px;
    display: grid;
    gap: 18px;
  }

  .acc-field-group {
    display: grid;
    gap: 14px;
  }

  .acc-field-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }

  .acc-field {
    display: grid;
    gap: 6px;
  }

  .acc-label {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11.5px;
    font-weight: 700;
    color: var(--text);
    letter-spacing: 0.005em;
    line-height: 1.25;
  }

  .acc-input-wrap {
    position: relative;
    display: flex;
    align-items: center;
  }

  .acc-input-icon {
    position: absolute;
    left: 12px;
    color: var(--subtle);
    pointer-events: none;
    flex-shrink: 0;
    transition: color 140ms ease;
  }

  .acc-input-wrap:focus-within .acc-input-icon {
    color: var(--accent-mid);
  }

  .acc-input-wrap input {
    width: 100%;
    border: 1.5px solid var(--border);
    border-radius: var(--radius);
    min-height: 42px;
    padding: 8px 12px 8px 36px;
    background: var(--surface);
    color: var(--text);
    font-size: 13.5px;
    line-height: 1.5;
    transition: border-color 140ms ease, box-shadow 140ms ease;
  }

  .acc-input-wrap input:focus {
    outline: none;
    border-color: var(--accent-mid);
    box-shadow: 0 0 0 3px rgba(59,130,246,0.12);
  }

  .acc-input-wrap input::placeholder {
    color: var(--subtle);
  }

  .acc-pw-toggle {
    position: absolute;
    right: 6px;
    width: 32px;
    height: 32px;
    border-radius: var(--radius);
    display: grid;
    place-items: center;
    border: 1px solid transparent;
    background: transparent;
    color: var(--subtle);
    cursor: pointer;
    transition: all 120ms ease;
    flex-shrink: 0;
  }

  .acc-pw-toggle:hover {
    color: var(--muted);
    background: var(--surface-hover);
  }

  .acc-pw-toggle svg {
    width: 15px;
    height: 15px;
  }

/* ── Role Cards ── */

  .acc-role-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }

  .acc-role-card {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 13px 14px;
    border: 1.5px solid var(--border);
    border-radius: var(--radius-md);
    background: var(--surface);
    cursor: pointer;
    transition: all 150ms ease;
    position: relative;
  }

  .acc-role-card:hover {
    border-color: #D1D5DB;
    background: var(--surface-soft);
  }

  .acc-role-card.selected {
    border-color: var(--accent-mid);
    background: var(--accent-light);
    box-shadow: 0 0 0 3px rgba(59,130,246,0.1);
  }

  .acc-role-card-icon {
    width: 34px;
    height: 34px;
    border-radius: var(--radius);
    display: grid;
    place-items: center;
    flex-shrink: 0;
    transition: all 150ms ease;
  }

  .acc-role-card-icon-admin {
    background: #DBEAFE;
    color: var(--accent);
    border: 1px solid var(--accent-border);
  }

  .acc-role-card.selected .acc-role-card-icon-admin {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }

  .acc-role-card-icon-user {
    background: var(--surface-soft);
    color: var(--muted);
    border: 1px solid var(--border);
  }

  .acc-role-card.selected .acc-role-card-icon-user {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }

  .acc-role-card-body {
    display: grid;
    gap: 2px;
    min-width: 0;
  }

  .acc-role-card-body strong {
    font-size: 13.5px;
    font-weight: 700;
    color: var(--text);
    line-height: 1.3;
  }

  .acc-role-card-body span {
    font-size: 11px;
    font-weight: 500;
    color: var(--muted);
    line-height: 1.3;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .acc-role-check {
    position: absolute;
    top: -7px;
    right: -7px;
    width: 20px;
    height: 20px;
    border-radius: 999px;
    background: var(--accent);
    color: #fff;
    display: grid;
    place-items: center;
    opacity: 0;
    transform: scale(0.5);
    transition: all 200ms cubic-bezier(0.34, 1.56, 0.64, 1);
    box-shadow: 0 2px 6px rgba(29,78,216,0.3);
  }

  .acc-role-card.selected .acc-role-check {
    opacity: 1;
    transform: scale(1);
  }

/* ── Modal Divider ── */

  .acc-modal-divider {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 10.5px;
    font-weight: 700;
    color: var(--subtle);
    text-transform: uppercase;
    letter-spacing: 0.07em;
    user-select: none;
  }

  .acc-modal-divider::before,
  .acc-modal-divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

/* ── Password Label ── */

  #acc-password-label {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }

  .acc-password-hint {
    font-size: 11px;
    font-weight: 400;
    color: var(--subtle);
    line-height: 1.25;
  }

/* ── Avatar Preview ── */

  .acc-modal-avatar-preview {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 16px;
    border-radius: var(--radius-md);
    background: var(--surface-soft);
    border: 1px dashed var(--border);
    transition: all 180ms ease;
    margin-top: 2px;
  }

  .acc-modal-avatar-preview.has-value {
    border-style: solid;
    border-color: var(--accent-border);
    background: var(--accent-light);
  }

  .acc-preview-ring {
    width: 40px;
    height: 40px;
    border-radius: 999px;
    display: grid;
    place-items: center;
    background: var(--surface);
    border: 2px solid var(--border);
    flex-shrink: 0;
    transition: all 180ms ease;
  }

  .acc-modal-avatar-preview.has-value .acc-preview-ring {
    border-color: var(--accent-mid);
    background: var(--accent);
  }

  .acc-preview-initial {
    font-size: 15px;
    font-weight: 800;
    color: var(--muted);
    line-height: 1;
    text-transform: uppercase;
    transition: color 180ms ease;
  }

  .acc-modal-avatar-preview.has-value .acc-preview-initial {
    color: #fff;
  }

  .acc-preview-text {
    display: grid;
    gap: 1px;
    min-width: 0;
  }

  .acc-preview-text strong {
    font-size: 13.5px;
    font-weight: 700;
    color: var(--text);
    line-height: 1.3;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    transition: color 180ms ease;
  }

  .acc-modal-avatar-preview.has-value .acc-preview-text strong {
    color: var(--accent);
  }

  .acc-preview-text span {
    font-size: 11.5px;
    font-weight: 500;
    color: var(--muted);
    line-height: 1.3;
  }

/* ── Modal Footer ── */

  .acc-modal-foot {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 10px;
    padding: 16px 22px 18px;
    flex-shrink: 0;
    border-top: 1px solid var(--line);
  }

  .acc-btn-save {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 9px 22px;
    min-width: 140px;
    min-height: 40px;
    border: none;
    border-radius: var(--radius);
    background: var(--accent);
    color: #fff;
    font-size: 13.5px;
    font-weight: 700;
    cursor: pointer;
    transition: all 140ms ease;
    box-shadow: 0 1px 3px rgba(29,78,216,0.25);
    position: relative;
    line-height: 1.25;
    font-family: inherit;
  }

  .acc-btn-save:hover {
    background: var(--accent-hover);
    box-shadow: 0 2px 8px rgba(29,78,216,0.35);
    transform: translateY(-1px);
  }

  .acc-btn-save:active {
    transform: translateY(0) scale(0.98);
  }

  .acc-btn-save:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    transform: none;
    box-shadow: none;
  }

  .acc-btn-save-icon {
    flex-shrink: 0;
  }

  .acc-btn-save.loading .acc-btn-save-icon,
  .acc-btn-save.loading span {
    opacity: 0;
  }

  .acc-btn-spinner {
    position: absolute;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    gap: 5px;
  }

  .acc-btn-spinner.active {
    display: flex;
  }

  .acc-spinner-dot {
    width: 6px;
    height: 6px;
    border-radius: 999px;
    background: rgba(255,255,255,0.7);
    animation: accDotBounce 0.6s ease-in-out infinite;
  }

  .acc-spinner-dot:nth-child(2) {
    animation-delay: 0.15s;
  }

  .acc-spinner-dot:nth-child(3) {
    animation-delay: 0.3s;
  }

  @keyframes accDotBounce {
    0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
    40% { transform: scale(1); opacity: 1; }
  }

/* ── RESPONSIVE: HAMBURGER TOGGLE ── */

  .sidebar-toggle {
    display: none;
    width: 36px;
    height: 36px;
    padding: 0;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--surface);
    color: var(--muted);
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
    transition: background 120ms ease, border-color 120ms ease;
    position: relative;
  }
  .sidebar-toggle:hover {
    background: var(--surface-hover);
    border-color: #D1D5DB;
    color: var(--text);
  }
  .sidebar-toggle .sidebar-toggle-close {
    display: none;
  }
  .sidebar-open .sidebar-toggle .sidebar-toggle-close {
    display: block;
  }
  .sidebar-open .sidebar-toggle svg:not(.sidebar-toggle-close) {
    display: none;
  }

  .sidebar-backdrop {
    position: fixed;
    inset: 0;
    z-index: 40;
    background: rgba(0,0,0,0.45);
    backdrop-filter: blur(2px);
    opacity: 0;
    transition: opacity 200ms ease;
    pointer-events: none;
  }

/* ── RESPONSIVE BREAKPOINT: 1024px (Tablet Landscape) ── */

  @media (max-width: 1024px) {
    .archive-folder-grid { grid-template-columns: 1fr !important; }
    .archive-folder-resizer { display: none !important; }

    .dashboard-bottom-row { grid-template-columns: 1fr; gap: 20px; }
    .content { padding: 24px 24px 48px; }
    .search-bar { width: 260px; }
    .topbar h1 { font-size: 15px; }
    .stat-row { flex-wrap: wrap; }
    .tall-card { min-height: 280px; }
    .tall-card-add { min-height: 280px; }
    .tall-card-template-cat { min-height: 240px; }
    .process-sticky-bar { 
      flex-direction: column; 
      align-items: stretch; 
      width: 100%; 
      border-radius: var(--radius-xl); 
      padding: 16px 20px;
    }
    .process-sticky-bar .preview-section { justify-content: center; width: 100%; }
    .process-sticky-bar .action-group { justify-content: center; width: 100%; }
  }

/* ── RESPONSIVE BREAKPOINT: 768px (Tablet Portrait / Small Tablet) ── */

  @media (max-width: 768px) {
    .sidebar-toggle { display: flex; }

    .app-shell {
      grid-template-columns: 1fr;
      position: relative;
      overflow: visible;
    }

    .sidebar {
      position: fixed;
      top: 0;
      left: -280px;
      width: 280px;
      height: 100dvh;
      z-index: 50;
      transition: left 260ms cubic-bezier(.2,0,0,1);
      box-shadow: none;
    }

    .sidebar-open .sidebar {
      left: 0;
      box-shadow: 4px 0 24px rgba(0,0,0,0.15);
    }

    .sidebar-open .sidebar-backdrop {
      opacity: 1;
      pointer-events: all;
    }

    .nav-group {
      flex-direction: column;
      flex-wrap: nowrap;
      padding: 8px 10px;
    }
    .nav-item { width: 100%; flex: none; font-size: 13px; padding: 10px 10px; }
    .nav-section-label { display: block; }
    .sidebar-footer { display: block; }

    .main { height: auto; overflow: visible; }
    .content { overflow-y: visible; padding: 16px 14px 40px; }

    .topbar {
      display: flex;
      height: auto;
      min-height: 52px;
      padding: 10px 14px;
      gap: 8px;
      flex-wrap: wrap;
    }
    .topbar-left { flex-direction: row; align-items: center; gap: 8px; flex: 1; min-width: 0; }
    .topbar h1 { font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .search-bar { order: 3; width: 100%; margin: 2px 0 0; }
    .search-dropdown { left: 0; right: 0; }
    .year-dropdown-container { flex-shrink: 0; }

    .activities-grid { grid-template-columns: 1fr; min-width: 0; }
    .subs-grid { grid-template-columns: 1fr; min-width: 0; }
    .folders-grid { grid-template-columns: 1fr; min-width: 0; }

    .grid-2, .grid-3, .grid-4 { grid-template-columns: 1fr; min-width: 0; }
    .form-grid { grid-template-columns: 1fr; min-width: 0; }

    .dashboard-bottom-row { grid-template-columns: 1fr; gap: 16px; }
    
    .metadata-grid, .metadata-grid-3 { grid-template-columns: 1fr; }
    .process-card .metadata-grid, .process-card .metadata-grid-3 { grid-template-columns: 1fr; }

    .metadata-header { flex-direction: column; align-items: flex-start; gap: 4px; }

    .process-source-grid { grid-template-columns: 1fr; min-width: 0; }
    .process-selectors { grid-template-columns: 1fr; min-width: 0; }
    .process-card .process-selectors { grid-template-columns: 1fr; min-width: 0; }
    .process-card .jumlah-satuan-row,
    .process-card .tanggal-uraian-row,
    .process-card .lokasi-triple-row { flex-direction: column !important; }
    .process-card { padding: 16px; min-width: 0; overflow: hidden; }
    .process-target-context { min-width: 0; overflow: hidden; word-wrap: break-word; }
    .process-target-context strong { display: block; word-break: break-word; white-space: normal; }
    .dropzone { min-width: 0; overflow: hidden; }
    .process-sticky-bar {
      flex-direction: column;
      align-items: stretch;
      gap: 10px;
      padding: 12px 14px;
    }
    .process-sticky-bar .preview-section {
      flex-direction: column;
      align-items: stretch;
      gap: 4px;
    }
    .process-sticky-bar .preview-name {
      max-width: none;
      text-align: center;
      white-space: normal;
      word-break: break-all;
    }
    .process-sticky-bar .action-group {
      justify-content: stretch;
      flex-direction: column;
      width: 100%;
    }
    .process-sticky-bar .action-group .btn {
      width: 100%;
      justify-content: center;
      white-space: normal;
      height: auto;
      min-height: 42px;
    }
    .process-sticky-bar .action-divider { display: none; }
    .process-card-header { flex-wrap: wrap; min-width: 0; }
    .process-card-desc { margin-left: 0; width: 100%; word-wrap: break-word; }
    .process-card-title { white-space: normal; word-wrap: break-word; }

    .archive-folder-grid { grid-template-columns: 1fr; }
    .archive-folder-header { flex-direction: column; align-items: stretch; gap: 10px; }
    .archive-folder-actions { justify-content: stretch; }
    .archive-folder-actions .btn { width: 100%; text-align: center; }

    .template-category-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .template-color-picker { grid-template-columns: repeat(2, minmax(0, 1fr)); }

    .template-section-head { flex-direction: column; align-items: stretch; }
    .template-section-count { width: fit-content; }
    .template-card { margin-bottom: 0; }
    .template-card-head { padding: 18px 18px 0; flex-wrap: wrap; }
    .template-card-body { padding: 16px 18px 20px; }
    .template-card-foot { padding: 12px 18px; flex-direction: column; }
    .template-card-foot .btn { width: 100%; }

    .settings-section-header-action,
    .app-page-card-header {
      flex-direction: column;
      align-items: stretch;
    }
    .app-page-card-actions,
    .app-page-card-actions .btn { width: 100%; }
    .app-page-card-actions { justify-content: stretch; }
    .settings-section-card { padding: 18px; }
    .settings-action-row { flex-direction: column; align-items: stretch; }
    .settings-action-row .form-field { min-width: 0; }
    .settings-action-row .btn { width: 100%; }
    .workspace-active-banner { flex-direction: column; align-items: stretch; }
    .workspace-summary { flex-direction: column; align-items: stretch; }

    .acc-field-row { grid-template-columns: 1fr; }
    .acc-role-grid { grid-template-columns: 1fr; }
    .acc-row-right { opacity: 1; }
    .acc-row { flex-wrap: wrap; padding: 12px 14px; }
    .acc-row-btn { opacity: 1; }

    .tabs-nav { gap: 0; }
    .tab-btn { padding: 8px 12px; font-size: 12px; }
    .theme-options-grid { grid-template-columns: 1fr; }
