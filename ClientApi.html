<script>
  function api(name, payload, options) {
    options = options || {};
    const sid = localStorage.getItem('portal_session_id');
    if (sid && name !== 'login') {
      payload = payload ? Object.assign({}, payload) : {};
      payload._sessionId = sid;
    }
    return new Promise((resolve, reject) => {
      let timer = null;
      let settled = false;
      const done = function (fn, value) {
        if (settled) return;
        settled = true;
        if (timer) window.clearTimeout(timer);
        fn(value);
      };
      if (options.timeoutMs) {
        timer = window.setTimeout(function () {
          done(reject, new Error(options.timeoutMessage || 'Koneksi lambat atau server belum merespon. Coba muat ulang data ini.'));
        }, options.timeoutMs);
      }
      google.script.run
        .withSuccessHandler(function (response) {
          if (response && typeof response === 'object' && 'success' in response) {
            if (response.success) {
              done(resolve, response.data);
            } else {
              var srvErr = new Error(response.error || 'Terjadi kesalahan dari peladen');
              handleSessionError_(srvErr);
              done(reject, srvErr);
            }
          } else {
            done(resolve, response);
          }
        })
        .withFailureHandler(function (error) {
          handleSessionError_(error);
          done(reject, error);
        })[name](payload);
    });
  }

  // Saat peladen menolak karena sesi habis/tidak ditemukan, bersihkan sesi lokal
  // dan munculkan modal login otomatis supaya user tidak terjebak error generik.
  function handleSessionError_(error) {
    var msg = error && (error.message || error) ? String(error.message || error) : '';
    if (msg.indexOf('Sesi login') === -1) return;
    try { localStorage.removeItem('portal_session_id'); } catch (e) {}
    if (typeof showLoginModal === 'function' && !document.getElementById('login-modal-backdrop')) {
      try { showLoginModal(); } catch (e) {}
    }
  }

  function setContent(html) {
    const contentEl = document.getElementById('content');
    if (contentEl) {
      contentEl.innerHTML = html;
      contentEl.scrollTop = 0;
    }
  }

  let activePersistentToast = null;

  function showToast(message, isPersistent) {
    var container = document.getElementById('toast-container');
    if (!container) return;

    // Detect if this is a process toast
    var isProcess = isPersistent || (message && message.indexOf('...') !== -1);
    
    // Replace the active persistent toast if it exists
    if (activePersistentToast && activePersistentToast.parentNode) {
      removeToast(activePersistentToast);
      activePersistentToast = null;
    }

    var toast = document.createElement('div');
    toast.className = 'toast visible';
    toast.style.display = 'flex';
    toast.style.alignItems = 'center';
    toast.style.justifyContent = 'space-between';
    toast.style.gap = '12px';
    
    var textSpan = document.createElement('span');
    textSpan.textContent = message;
    textSpan.style.lineHeight = '1.4';
    toast.appendChild(textSpan);

    if (isProcess) {
      toast.classList.add('is-persistent');
      activePersistentToast = toast;
      
      // Add close button for persistent toasts so user can dismiss them
      var closeBtn = document.createElement('button');
      closeBtn.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>';
      closeBtn.style.background = 'transparent';
      closeBtn.style.border = 'none';
      closeBtn.style.color = '#9CA3AF';
      closeBtn.style.cursor = 'pointer';
      closeBtn.style.padding = '4px';
      closeBtn.style.margin = '-4px -4px -4px 0';
      closeBtn.style.display = 'grid';
      closeBtn.style.placeItems = 'center';
      closeBtn.style.borderRadius = '6px';
      closeBtn.style.transition = 'background 150ms ease, color 150ms ease';
      
      closeBtn.onmouseover = function() {
        this.style.background = 'rgba(255,255,255,0.1)';
        this.style.color = '#FFFFFF';
      };
      closeBtn.onmouseout = function() {
        this.style.background = 'transparent';
        this.style.color = '#9CA3AF';
      };

      closeBtn.onclick = function() { removeToast(toast); };
      toast.appendChild(closeBtn);
    } else {
      window.setTimeout(function () {
        removeToast(toast);
      }, 4000);
    }
    
    container.appendChild(toast);
    return toast;
  }

  function removeToast(toast) {
    if (!toast) return;
    toast.classList.remove('visible');
    if (toast === activePersistentToast) {
      activePersistentToast = null;
    }
    window.setTimeout(function () { if (toast.parentNode) toast.parentNode.removeChild(toast); }, 200);
  }

  function showProcessToast(message) {
    var toast = showToast(message, true);
    return {
      toast: toast,
      success: function(successMsg) {
        removeToast(toast);
        if (successMsg) showToast(successMsg, true); // Feedback is now persistent
      },
      error: function(errorMsg) {
        removeToast(toast);
        if (errorMsg) showToast(errorMsg, true); // Error feedback is now persistent
      },
      hide: function() {
        removeToast(toast);
      }
    };
  }

  function esc(value) {
    return String(value == null ? '' : value)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');
  }

  function formatDateTime(value) {
    if (!value) return '-';
    const date = new Date(value);
    if (Number.isNaN(date.getTime())) return value;
    return date.toLocaleString('id-ID', {
      day: '2-digit',
      month: 'short',
      year: 'numeric',
      hour: '2-digit',
      minute: '2-digit'
    });
  }

  function formatDateStr(value) {
    if (!value) return '-';
    const date = new Date(value);
    if (Number.isNaN(date.getTime())) return value;
    return date.toLocaleString('id-ID', { day: '2-digit', month: 'short', year: 'numeric' });
  }

  function formatTimeStr(value) {
    if (!value) return '';
    const date = new Date(value);
    if (Number.isNaN(date.getTime())) return '';
    return date.toLocaleString('id-ID', { hour: '2-digit', minute: '2-digit' });
  }

  function errorMessage(err) {
    if (!err) return 'Terjadi kesalahan tidak dikenal';
    if (typeof err === 'string') return err;
    return err.message || String(err);
  }
</script>
