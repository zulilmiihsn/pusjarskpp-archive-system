<script>
  const _apiQueue = [];
  let _apiQueueRunning = false;
  let _sessionToken = (function() {
    try { return sessionStorage.getItem('pa_session_token') || localStorage.getItem('pa_session_token') || ''; } catch (e) { return ''; }
  })();
  let _authGeneration = 0;

  function getSessionToken() { return _sessionToken; }
  function getAuthGeneration() { return _authGeneration; }
  function setSessionToken(token) {
    _sessionToken = String(token || '');
    _authGeneration++;
    try {
      if (_sessionToken) {
        sessionStorage.setItem('pa_session_token', _sessionToken);
        localStorage.setItem('pa_session_token', _sessionToken);
      } else {
        sessionStorage.removeItem('pa_session_token');
        localStorage.removeItem('pa_session_token');
      }
    } catch (e) {}
  }
  function clearSessionToken() {
    _sessionToken = '';
    _authGeneration++;
    try {
      sessionStorage.removeItem('pa_session_token');
      localStorage.removeItem('pa_session_token');
    } catch (e) {}
  }

  function api(name, payload, options) {
    if (name.startsWith('delete')) {
      return new Promise((resolve, reject) => {
        _apiQueue.push({ name, payload, options, resolve, reject });
        _processApiQueue();
      });
    }
    return _executeApi(name, payload, options);
  }

  async function _processApiQueue() {
    if (_apiQueueRunning || _apiQueue.length === 0) return;
    _apiQueueRunning = true;
    while (_apiQueue.length > 0) {
      const task = _apiQueue.shift();
      try {
        const result = await _executeApi(task.name, task.payload, task.options);
        task.resolve(result);
      } catch (e) {
        task.reject(e);
      }
    }
    _apiQueueRunning = false;
  }

  function _executeApi(name, payload, options) {
    options = options || {};
    const sid = getSessionToken();
    if (sid && name !== 'login') {
      payload = payload ? Object.assign({}, payload) : {};
      payload._sessionId = sid;
    }
    return new Promise((resolve, reject) => {
      let timer = null;
      let settled = false;
      const done = function (fn, value) {
        if (settled) return;
        settled = true;
        if (timer) window.clearTimeout(timer);
        fn(value);
      };
      const methodTimeout = (typeof API_TIMEOUTS_MS !== 'undefined' && API_TIMEOUTS_MS[name])
        ? API_TIMEOUTS_MS[name]
        : 0;
      const defaultTimeout = methodTimeout || ((typeof API_TIMEOUT_MS !== 'undefined') ? API_TIMEOUT_MS : 30000);
      const timeoutMs = Number(options.timeoutMs !== undefined ? options.timeoutMs : defaultTimeout);
      if (timeoutMs > 0) {
        timer = window.setTimeout(function () {
          const longOperation = timeoutMs >= 120000;
          const fallbackMessage = longOperation
            ? 'Operasi belum selesai setelah ' + Math.round(timeoutMs / 1000) + ' detik. Server mungkin masih bekerja. Jangan ulangi operasi sebelum memeriksa status ruang kerja.'
            : 'Server belum merespons setelah ' + Math.round(timeoutMs / 1000) + ' detik. Periksa koneksi, lalu coba lagi.';
          const timeoutError = new Error(options.timeoutMessage || fallbackMessage);
          timeoutError.code = 'CLIENT_TIMEOUT';
          timeoutError.operation = name;
          timeoutError.serverMayStillBeRunning = true;
          done(reject, timeoutError);
        }, timeoutMs);
      }
      google.script.run
        .withSuccessHandler(function (response) {
          if (response && typeof response === 'object' && 'success' in response) {
            if (response.success) {
              done(resolve, response.data);
            } else {
              var srvErr = new Error(response.error || 'Terjadi kesalahan dari server');
              srvErr.code = response.errorCode || 'UNKNOWN_ERROR';
              srvErr.requestId = response.requestId || '';
              handleSessionError_(srvErr);
              done(reject, srvErr);
            }
          } else {
            done(resolve, response);
          }
        })
        .withFailureHandler(function (error) {
          handleSessionError_(error);
          done(reject, error);
        })[name](payload);
    });
  }

  function isAccessDeniedError_(error) {
    if (error && error.code === 'ACCESS_DENIED') return true;
    const message = error && (error.message || error) ? String(error.message || error).toLowerCase() : '';
    return message.indexOf('akses ditolak') >= 0 || message.indexOf('akses tidak ditemukan') >= 0 || message.indexOf('access denied') >= 0;
  }

  // Hanya sesi hilang/kedaluwarsa yang boleh menghapus token. Penolakan role,
  // scope Drive, atau permission resource bersifat nonfatal.
  function handleSessionError_(error) {
    if (isAccessDeniedError_(error)) return;
    var isAuthErr = error && error.code === 'AUTH_ERROR';
    if (!isAuthErr) {
      // Fallback for native google script failures
      var msg = error && (error.message || error) ? String(error.message || error).toLowerCase() : '';
      if (msg.indexOf('sesi login') === -1 && msg.indexOf('sesi telah berakhir') === -1) return;
    }
    clearSessionToken();
    if (typeof state !== 'undefined') {
      state.currentUser = { role: 'guest', username: '', displayName: 'Tamu' };
      state.authReady = true;
    }
    const appShell = document.getElementById('app');
    if (appShell) appShell.classList.add('auth-pending');
    if (typeof showLoginModal === 'function' && !document.getElementById('login-modal-backdrop')) {
      try { showLoginModal(); } catch (e) {}
    }
  }

  function setContent(html) {
    const contentEl = document.getElementById('content');
    if (contentEl) {
      contentEl.innerHTML = html;
      contentEl.scrollTop = 0;
      // Retrigger animasi masuk halaman: lepas kelas, paksa reflow, pasang lagi.
      contentEl.classList.remove('view-anim');
      void contentEl.offsetWidth;
      contentEl.classList.add('view-anim');
    }
  }

  // Sembunyikan elemen (modal) dengan animasi keluar lalu set display:none.
  // Selalu menutup pada akhirnya (animationend ATAU fallback timeout) supaya
  // tak ada modal yang macet. Instan saat prefers-reduced-motion.
  function hideElementAnimated(el, onDone) {
    if (!el) { if (typeof onDone === 'function') onDone(); return; }
    const finish = function () {
      // Dibatalkan bila modal dibuka ulang sebelum animasi selesai (open melepas is-closing).
      if (!el.classList.contains('is-closing')) return;
      el.classList.remove('is-closing');
      el.style.display = 'none';
      if (typeof onDone === 'function') onDone();
    };
    const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduce || el.style.display === 'none') {
      el.classList.remove('is-closing');
      el.style.display = 'none';
      if (typeof onDone === 'function') onDone();
      return;
    }
    el.classList.add('is-closing');
    let done = false;
    const handler = function () {
      if (done) return;
      done = true;
      el.removeEventListener('animationend', handler);
      finish();
    };
    el.addEventListener('animationend', handler);
    window.setTimeout(handler, 220); // fallback bila animationend tak terpicu
  }

  let activePersistentToast = null;

  function showToast(message, isPersistent) {
    var container = document.getElementById('toast-container');
    if (!container) return;

    // Detect if this is a process toast
    var isProcess = !!isPersistent;
    
    // Replace the active persistent toast if it exists
    if (activePersistentToast && activePersistentToast.parentNode) {
      removeToast(activePersistentToast);
      activePersistentToast = null;
    }

    var toast = document.createElement('div');
    toast.className = 'toast visible';
    toast.style.display = 'flex';
    toast.style.alignItems = 'center';
    toast.style.justifyContent = 'space-between';
    toast.style.gap = '12px';
    
    var textSpan = document.createElement('span');
    textSpan.textContent = message;
    textSpan.style.lineHeight = '1.5';
    textSpan.style.flex = '1';
    textSpan.style.wordBreak = 'break-word';
    toast.appendChild(textSpan);

    if (isProcess) {
      toast.classList.add('is-persistent');
      activePersistentToast = toast;
    } else {
      window.setTimeout(function () {
        removeToast(toast);
      }, 4000);
    }
    
    container.appendChild(toast);
    return toast;
  }

  function removeToast(toast) {
    if (!toast) return;
    // Terima controller showProcessToast ({toast, success, error, hide}) maupun
    // elemen toast langsung. Banyak pemanggil meneruskan controller; tanpa unwrap
    // ini, toast.classList undefined dan melempar TypeError setelah operasi sukses.
    if (!toast.classList && toast.toast) toast = toast.toast;
    if (!toast || !toast.classList) return;
    toast.classList.remove('visible');
    if (toast === activePersistentToast) {
      activePersistentToast = null;
    }
    window.setTimeout(function () { if (toast.parentNode) toast.parentNode.removeChild(toast); }, 200);
  }

  function showProcessToast(message) {
    var toast = showToast(message, true);
    return {
      toast: toast,
      success: function(successMsg) {
        removeToast(toast);
        if (successMsg) showToast(successMsg, false);
      },
      error: function(errorMsg) {
        removeToast(toast);
        if (errorMsg) showToast(errorMsg, false);
      },
      hide: function() {
        removeToast(toast);
      }
    };
  }

  /**
   * Toast dengan progress step-by-step.
   * @param {number} totalSteps - Jumlah total langkah
   * @param {string} initialLabel - Label langkah pertama
   * @returns {{advance: Function, complete: Function, error: Function, hide: Function}}
   */
  function showSteppedProcessToast(totalSteps, initialLabel) {
    var container = document.getElementById('toast-container');
    if (!container) return null;

    if (activePersistentToast && activePersistentToast.parentNode) {
      removeToast(activePersistentToast);
      activePersistentToast = null;
    }

    var toast = document.createElement('div');
    toast.className = 'toast toast-stepped visible';
    toast.style.display = 'block';

    // Persentase + label row
    var headerRow = document.createElement('div');
    headerRow.className = 'toast-stepped-header';

    var pctCounter = document.createElement('span');
    pctCounter.className = 'toast-step-counter';
    pctCounter.textContent = '0%';

    var stepLabel = document.createElement('span');
    stepLabel.className = 'toast-step-label';
    stepLabel.textContent = initialLabel;

    headerRow.appendChild(pctCounter);
    headerRow.appendChild(stepLabel);

    // Progress bar
    var progressTrack = document.createElement('div');
    progressTrack.className = 'toast-progress-track';

    var progressFill = document.createElement('div');
    progressFill.className = 'toast-progress-fill';
    progressFill.style.width = '0%';

    progressTrack.appendChild(progressFill);

    toast.appendChild(headerRow);
    toast.appendChild(progressTrack);

    toast.classList.add('is-persistent');
    activePersistentToast = toast;
    container.appendChild(toast);

    // --- Simulasi progress persen yang merayap halus ---
    // Tiap langkah punya batas lunak (langkah ke-n menuju ~n/steps), tapi disisakan
    // sedikit ruang biar complete() yang menutup ke 100%. Bar terus bergerak (tidak
    // lompat kaku per-step) dan melambat saat mendekati batas tiap langkah.
    var steps = Math.max(1, totalSteps || 1);
    var stepIndex = 1;
    var displayPct = 0;
    var done = false;
    // Langkah awal naik cepat sampai ~70%; langkah TERAKHIR (tulis spreadsheet,
    // bagian yang lama) merayap pelan dari situ menuju ~99% supaya tidak kesan macet.
    function capFor(idx) {
      if (idx >= steps) return 99;
      return Math.round((idx / steps) * 70);
    }
    var capPct = capFor(stepIndex);

    function render() {
      progressFill.style.width = displayPct.toFixed(1) + '%';
      pctCounter.textContent = Math.round(displayPct) + '%';
    }

    var timer = window.setInterval(function () {
      if (done || displayPct >= capPct) return;
      var isFinal = stepIndex >= steps;
      var factor = isFinal ? 0.018 : 0.08; // langkah terakhir merayap lebih pelan
      var floor = isFinal ? 0.08 : 0.25;
      var delta = (capPct - displayPct) * factor;
      if (delta < floor) delta = floor; // tetap merayap, jangan macet
      displayPct += delta;
      if (displayPct > capPct) displayPct = capPct;
      render();
    }, 80);

    function stopTimer() { if (timer) { window.clearInterval(timer); timer = null; } }

    render();

    return {
      toast: toast,
      advance: function (label) {
        stepIndex++;
        if (stepIndex > steps) stepIndex = steps;
        capPct = capFor(stepIndex);
        if (label) stepLabel.textContent = label;
      },
      complete: function (successMsg) {
        done = true;
        stopTimer();
        displayPct = 100;
        progressFill.style.width = '100%';
        progressFill.classList.add('toast-progress-complete');
        pctCounter.textContent = '100%';
        stepLabel.textContent = successMsg || 'Selesai';
        // Tampilkan hasil di toast progress ini lalu fade — tanpa memunculkan
        // toast kedua (biar notif selesai tidak dobel).
        window.setTimeout(function () { removeToast(toast); }, 1600);
      },
      error: function (errorMsg) {
        done = true;
        stopTimer();
        progressFill.classList.add('toast-progress-error');
        removeToast(toast);
        if (errorMsg) showToast(errorMsg, false);
      },
      hide: function () {
        done = true;
        stopTimer();
        removeToast(toast);
      }
    };
  }

  function esc(value) {
    return String(value == null ? '' : value)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');
  }

  function formatDateTime(value) {
    if (!value) return '-';
    const date = new Date(value);
    if (Number.isNaN(date.getTime())) return value;
    return date.toLocaleString('id-ID', {
      day: '2-digit',
      month: 'short',
      year: 'numeric',
      hour: '2-digit',
      minute: '2-digit'
    });
  }

  function formatDateStr(value) {
    if (!value) return '-';
    const date = new Date(value);
    if (Number.isNaN(date.getTime())) return value;
    return date.toLocaleString('id-ID', { day: '2-digit', month: 'short', year: 'numeric' });
  }

  function formatTimeStr(value) {
    if (!value) return '';
    const date = new Date(value);
    if (Number.isNaN(date.getTime())) return '';
    return date.toLocaleString('id-ID', { hour: '2-digit', minute: '2-digit' });
  }

  function errorMessage(err) {
    if (!err) return 'Terjadi kesalahan tidak dikenal';
    if (typeof err === 'string') return err;
    const base = err.message || String(err);
    const requestId = String(err.requestId || '');
    return requestId ? base + ' (Referensi: ' + requestId.slice(0, 8) + ')' : base;
  }
</script>
