<script>
  function api(name, payload, options) {
    options = options || {};
    const sid = localStorage.getItem('portal_session_id');
    if (sid && name !== 'login') {
      payload = payload ? Object.assign({}, payload) : {};
      payload._sessionId = sid;
    }
    return new Promise((resolve, reject) => {
      let timer = null;
      let settled = false;
      const done = function (fn, value) {
        if (settled) return;
        settled = true;
        if (timer) window.clearTimeout(timer);
        fn(value);
      };
      if (options.timeoutMs) {
        timer = window.setTimeout(function () {
          done(reject, new Error(options.timeoutMessage || 'Koneksi lambat atau server belum merespon. Coba muat ulang data ini.'));
        }, options.timeoutMs);
      }
      google.script.run
        .withSuccessHandler(function (response) {
          if (response && typeof response === 'object' && 'success' in response) {
            if (response.success) {
              done(resolve, response.data);
            } else {
              done(reject, new Error(response.error || 'Terjadi kesalahan dari peladen'));
            }
          } else {
            done(resolve, response);
          }
        })
        .withFailureHandler(function (error) {
          done(reject, error);
        })[name](payload);
    });
  }

  function setContent(html) {
    const contentEl = document.getElementById('content');
    if (contentEl) {
      contentEl.innerHTML = html;
      contentEl.scrollTop = 0;
    }
  }

  function showToast(message, isPersistent) {
    var container = document.getElementById('toast-container');
    if (!container) return;

    var toast = document.createElement('div');
    toast.className = 'toast visible';
    toast.textContent = message;
    if (isPersistent) {
      toast.classList.add('is-persistent');
    } else {
      window.setTimeout(function () {
        toast.classList.remove('visible');
        window.setTimeout(function () { if (toast.parentNode) toast.parentNode.removeChild(toast); }, 200);
      }, 4000);
    }
    container.appendChild(toast);
    return toast;
  }

  function removeToast(toast) {
    if (!toast) return;
    toast.classList.remove('visible');
    window.setTimeout(function () { if (toast.parentNode) toast.parentNode.removeChild(toast); }, 200);
  }

  function esc(value) {
    return String(value == null ? '' : value)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');
  }

  function formatDateTime(value) {
    if (!value) return '-';
    const date = new Date(value);
    if (Number.isNaN(date.getTime())) return value;
    return date.toLocaleString('id-ID', {
      day: '2-digit',
      month: 'short',
      year: 'numeric',
      hour: '2-digit',
      minute: '2-digit'
    });
  }

  function formatDateStr(value) {
    if (!value) return '-';
    const date = new Date(value);
    if (Number.isNaN(date.getTime())) return value;
    return date.toLocaleString('id-ID', { day: '2-digit', month: 'short', year: 'numeric' });
  }

  function formatTimeStr(value) {
    if (!value) return '';
    const date = new Date(value);
    if (Number.isNaN(date.getTime())) return '';
    return date.toLocaleString('id-ID', { hour: '2-digit', minute: '2-digit' });
  }

  function errorMessage(err) {
    if (!err) return 'Terjadi kesalahan tidak dikenal';
    if (typeof err === 'string') return err;
    return err.message || String(err);
  }
</script>
