<script>
  // Fallback bila bootstrap lama belum membawa documentTypes (sebelum refresh).
  var DOC_CATEGORIES_FALLBACK = [
    { id: 'doc-url-data_fix_peserta', name: 'Data Fix Peserta' },
    { id: 'doc-url-kumpulan_materi', name: 'Kumpulan Materi' },
    { id: 'doc-url-laporan', name: 'Laporan Aktualisasi/Inovasi' },
    { id: 'doc-url-sertifikat', name: 'Sertifikat' }
  ];
  // Sumber tunggal tipe dokumen — digerakkan dari bootstrap (documentTypes).
  function getDocCategories_() {
    var types = (state.bootstrap && state.bootstrap.documentTypes) || null;
    if (types && types.length) {
      return types.map(function (t) { return { id: 'doc-url-' + t.key, name: t.label }; });
    }
    return DOC_CATEGORIES_FALLBACK;
  }
  function getUnfilledDocCategories_(existingFiles) {
    var existingNames = (existingFiles || []).map(function(f) { return (f.name || '').toLowerCase(); });
    return getDocCategories_().filter(function(cat) {
      return existingNames.indexOf(cat.name.toLowerCase()) === -1;
    });
  }

  const ARCHIVE_FOLDER_PAGE_SIZE = 60;
  let archiveFolderObserver = null;
  let archiveFolderLoadingMore = false;

  function renderArchiveFolder() {
    const context = getArchiveFolderContext();
    if (!context.activity || !context.subActivity || !context.folderId) {
      setView(context.activity ? 'activity_detail' : 'dashboard', context.activity ? { activityId: context.activity.activity_id } : {});
      return;
    }

    const crumb = buildArchiveBreadcrumb(context);
    const colorTheme = getActivityColor(context.activity ? context.activity.activity_id : '');
    setContent(`
      <div class="toolbar mb-20">
        <button class="btn" id="archive-back">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="mr-4">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
          </svg>
          Kembali ke Detail Kegiatan
        </button>
      </div>

      <div class="panel panel-pad stack relative mb-24" style="overflow: visible;">
        <div style="position: absolute; top:0; left:0; right:0; height:6px; border-radius: var(--radius-lg) var(--radius-lg) 0 0; background: ${colorTheme};"></div>
        <div class="flex justify-between items-start flex-wrap gap-16">
          <div>
            <div class="breadcrumb-line eyebrow mb-4">${crumb.map(item => `<span>${esc(item)}</span>`).join('<span class="breadcrumb-sep">/</span>')}</div>
            <h2 class="section-title mt-4 mb-8">${esc(context.folderName || context.subActivity.sub_activity_name)}</h2>
            <p class="section-subtitle muted small mb-12">
              Laci ${esc(context.activity.laci_no)} &bull; Folder Induk ${esc(context.activity.folder_no)} ${context.subActivity && context.subActivity.no_folder ? `&bull; Folder ${esc(context.subActivity.no_folder)}` : ''} ${context.subActivity && context.subActivity.default_kode_klasifikasi ? `&bull; Klasifikasi ${esc(context.subActivity.default_kode_klasifikasi)}` : ''}
            </p>
          </div>
          <div class="flex items-center gap-4 shrink-0">
            ${context.folderId && !isGuest() ? `
              <a href="https://drive.google.com/drive/folders/${esc(context.folderId)}" target="_blank" class="sub-action-btn" title="Buka Folder Item">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
                  <polyline points="15 3 21 3 21 9"/>
                  <line x1="10" y1="14" x2="21" y2="3"/>
                </svg>
              </a>
            ` : ''}
            ${!isGuest() ? `
            <div class="dropdown">
              <button class="sub-action-btn" data-action="toggle-dropdown" title="Opsi lainnya">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <circle cx="12" cy="5" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="19" r="1"/>
                </svg>
              </button>
              <div class="sub-dropdown-menu">
                <button class="sub-dropdown-item" id="archive-edit-sub-metadata">Edit Sub-kegiatan</button>
                <button class="sub-dropdown-item" id="archive-convert-to-parent">Ubah Jadi Induk & Tambah Sub</button>
              </div>
            </div>
            ` : ''}
          </div>
        </div>
        ${!isGuest() ? `
        <div class="flex items-center gap-8 flex-wrap" style="margin-top:0;">
          <button class="btn btn-primary" id="archive-add-document">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" class="mr-4" aria-hidden="true">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
              <polyline points="14 2 14 8 20 8"/>
              <line x1="12" y1="18" x2="12" y2="12"/>
              <polyline points="9 15 12 12 15 15"/>
            </svg>
            <span class="small">Tambah Item</span>
          </button>
          <div class="dropdown">
            <button class="btn btn-primary" data-action="toggle-dropdown" aria-label="Tambah Dokumen">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" class="mr-4" aria-hidden="true">
                <path d="M10 13a5 5 0 0 0 7.1 0l2.4-2.4a5 5 0 0 0-7.1-7.1L11 4.9"/>
                <path d="M14 11a5 5 0 0 0-7.1 0l-2.4 2.4a5 5 0 0 0 7.1 7.1L13 19.1"/>
              </svg>
              <span class="small">Tambah Dokumen</span>
            </button>
            <div class="sub-dropdown-menu" id="doc-add-dropdown-menu"></div>
        </div>
        ` : ''}
      </div>
      </div>

      <div id="convert-parent-modal" class="modal-backdrop" style="display: none;">
        <div class="modal-card">
          <div class="modal-header">
            <h3 class="section-title">Ubah Menjadi Folder Induk</h3>
            <button class="btn icon-btn" id="btn-cancel-convert-icon" aria-label="Tutup">x</button>
          </div>
          <div class="panel-pad">
            <div style="background: #FEF2F2; color: #991B1B; padding: 12px; border-radius: var(--radius-sm); border: 1px solid #F87171; margin-bottom: 16px;" class="small">
              <strong>Peringatan!</strong> Melakukan ini akan membuat <strong>${esc(context.subActivity.sub_activity_name)}</strong> menjadi folder induk biasa. Seluruh arsip, dokumen, dan data sheet miliknya saat ini akan <strong>dipindahtangankan</strong> ke sub-kegiatan baru di bawah ini.
            </div>
            <p class="small muted mb-16">Masukkan nama sub-kegiatan penerus (anak baru).</p>
            <div class="form-field">
              <label for="new-convert-sub-name">Nama Anak Baru (Penerus)</label>
              <input type="text" id="new-convert-sub-name" placeholder="Contoh: Sesi Pagi">
            </div>
            <div class="button-row mt-24 justify-end">
              <button class="btn" id="btn-cancel-convert">Batal</button>
              <button class="btn btn-primary" id="btn-submit-convert" style="background: #DC2626; border-color: #DC2626;">Ya, Lanjutkan</button>
            </div>
          </div>
        </div>
      </div>

      <div id="archive-folder-content" class="archive-folder-content">
        <div class="empty" id="archive-folder-loading">${loadingHtml('Memuat isi folder...')}</div>
      </div>

      ${archiveFolderModalHtml()}
    `);

    bindArchiveFolderShell(context);
    loadArchiveFolderContent(context);
  }

  function getArchiveFolderContext() {
    const activity = getActivity(state.selectedActivityId || state.preselectedActivityId);
    const subActivity = activity
      ? (activity.subActivities || []).find(sub => sub.sub_activity_id === (state.selectedSubActivityId || state.preselectedSubActivityId))
      : null;
    const folderId = state.selectedFolderId || (subActivity && subActivity.folder_id) || '';
    const folderName = state.selectedFolderName || (subActivity && subActivity.sub_activity_name) || '';
    return { activity, subActivity, folderId, folderName };
  }

  function buildArchiveBreadcrumb(context) {
    if (context.activity && context.subActivity && context.subActivity.parent_folder_name) {
      return [
        context.activity.activity_name,
        context.subActivity.parent_folder_name,
        context.subActivity.sub_activity_name
      ].filter(Boolean);
    }
    const base = [
      context.activity ? context.activity.activity_name : '',
      context.subActivity ? context.subActivity.sub_activity_name : ''
    ].filter(Boolean);
    const extra = Array.isArray(state.selectedFolderBreadcrumb) ? state.selectedFolderBreadcrumb.slice() : [];
    if (extra.length > 0) return extra;
    if (context.folderName && context.subActivity && context.folderName !== context.subActivity.sub_activity_name) {
      base.push(context.folderName);
    }
    return base;
  }

  function findMappedSubActivityForFolder_(activity, folderId) {
    if (!activity || !folderId) return null;
    return (activity.subActivities || []).find(sub => String(sub.folder_id || '') === String(folderId));
  }

  function breadcrumbForMappedSubActivity_(activity, subActivity, fallbackName) {
    if (!activity || !subActivity) return [fallbackName].filter(Boolean);
    const parts = [activity.activity_name];
    if (subActivity.parent_folder_name) parts.push(subActivity.parent_folder_name);
    parts.push(subActivity.sub_activity_name || fallbackName);
    return parts.filter(Boolean);
  }

  function bindArchiveFolderShell(context) {
    const back = document.getElementById('archive-back');
    if (back) {
      back.addEventListener('click', () => {
        if (context.subActivity && context.folderId !== context.subActivity.folder_id) {
          setView('archive_folder', {
            activityId: context.activity.activity_id,
            subActivityId: context.subActivity.sub_activity_id,
            folderId: context.subActivity.folder_id,
            folderName: context.subActivity.sub_activity_name,
            folderBreadcrumb: [context.activity.activity_name, context.subActivity.sub_activity_name]
          });
        } else {
          setView('activity_detail', { activityId: context.activity.activity_id });
        }
      });
    }

    document.getElementById('archive-add-document')?.addEventListener('click', () => {
      state.draft = null;
      setView('process', {
        preselectedActivityId: context.activity.activity_id,
        preselectedSubActivityId: context.subActivity.sub_activity_id,
        targetFolderId: context.folderId,
        targetFolderName: context.folderName || context.subActivity.sub_activity_name,
        folderBreadcrumb: buildArchiveBreadcrumb(context)
      });
    });
    document.getElementById('doc-add-dropdown-menu')?.addEventListener('click', function (e) {
      var item = e.target.closest('[data-doc-category]');
      if (!item) return;
      var categoryId = item.dataset.docCategory;
      var categoryName = item.dataset.docCategoryName;
      var category = getDocCategories_().find(function (c) { return c.id === categoryId; });
      if (!category) return;
      e.target.closest('.sub-dropdown-menu')?.classList.remove('open');
      
      var availableCats = getUnfilledDocCategories_(window.currentArchiveResultFiles || []);
      
      openArchiveDocLinkModal({
        title: 'Tambah Dokumen',
        categoryName: categoryName,
        allCategories: availableCats,
        contextParts: buildArchiveBreadcrumb(context),
        currentUrl: '',
        onSubmit: async function (url, cat) {
          var catId = cat ? cat.id : categoryId;
          var catName = cat ? cat.name : categoryName;
          var loadToast = showProcessToast('Menambahkan dokumen ' + catName + '...', true);
          try {
            var res = await api('addArchiveDocumentLink', {
              parentFolderId: context.folderId,
              category: catId,
              name: catName,
              url: url,
              activityId: context.activity ? context.activity.activity_id : '',
              subActivityId: context.subActivity ? context.subActivity.sub_activity_id : '',
              year: state.bootstrap.settings.currentYear
            });
            if (loadToast) removeToast(loadToast);
            if (res && res.error) { showToast(res.error); return; }
            showToast('Dokumen ' + catName + ' berhasil ditambahkan!');
            invalidateViewCache('archive_folder');
            await loadArchiveFolderContent(context);
          } catch (err) {
            if (loadToast) removeToast(loadToast);
            showToast('Gagal menambahkan ' + catName + ': ' + (err.message || String(err)));
          }
        }
      });
    });

    document.getElementById('archive-add-folder')?.addEventListener('click', () => {
      openArchiveFolderModal({
        mode: 'add-folder',
        title: 'Tambah Folder Turunan',
        label: 'Nama folder',
        value: '',
        submitText: 'Tambah',
        payload: { parentFolderId: context.folderId }
      });
    });
    document.getElementById('archive-edit-sub-metadata')?.addEventListener('click', () => {
      if (typeof openEditSubModal === 'function') {
        openEditSubModal(context.activity, context.subActivity);
      }
    });

    document.getElementById('archive-convert-to-parent')?.addEventListener('click', () => {
      openModal_('convert-parent-modal');
      const input = document.getElementById('new-convert-sub-name');
      if (input) { input.value = ''; input.focus(); }
    });

    document.getElementById('btn-cancel-convert')?.addEventListener('click', () => closeModal_('convert-parent-modal'));
    document.getElementById('btn-cancel-convert-icon')?.addEventListener('click', () => closeModal_('convert-parent-modal'));

    document.getElementById('btn-submit-convert')?.addEventListener('click', async () => {
      const input = document.getElementById('new-convert-sub-name');
      const newSubName = input ? input.value.trim() : '';
      if (!newSubName) {
        showToast('Nama anak baru (penerus) wajib diisi.');
        return;
      }
      const btn = document.getElementById('btn-submit-convert');
      const origText = btn.innerHTML;
      btn.innerHTML = '<span class="spinner"></span> Memproses...';
      btn.disabled = true;

      try {
        const res = await api('convertSubActivityToParent', {
          year: state.bootstrap.settings.currentYear,
          activityId: context.activity.activity_id,
          subActivityId: context.subActivity.sub_activity_id,
          newSubActivityName: newSubName
        });
        btn.innerHTML = origText;
        btn.disabled = false;
        closeModal_('convert-parent-modal');
        if (res && res.bootstrap) {
          state.bootstrap = res.bootstrap;
        }
        invalidateViewCache();
        // Kembali ke halaman sebelumnya
        setView('activity_detail', { activityId: context.activity.activity_id });
      } catch (err) {
        btn.innerHTML = origText;
        btn.disabled = false;
        showToast('Error: ' + (err && err.message ? err.message : err));
      }
    });
  }

  async function loadArchiveFolderContent(context) {
    const rid = currentRenderId();
    const container = document.getElementById('archive-folder-content');
    if (!container) return;
    const cacheParams = { folderId: context.folderId, pageSize: ARCHIVE_FOLDER_PAGE_SIZE };
    // SWR: selalu paint dari cache yang ada (abaikan versi) supaya tidak flash
    // spinner saat refresh. Revalidasi versi ditangani getCachedOrFetch di bawah.
    const cached = getCachedView('archive_folder', cacheParams);
    if (cached) {
      state.selectedFolderName = cached.data.current ? cached.data.current.name : context.folderName;
      paintArchiveFolderContent(cached.data, context);
    } else {
      container.innerHTML = loadingHtml('Memuat isi folder...');
    }
    try {
      const wrapped = await getCachedOrFetch('archive_folder', cacheParams, function () {
        return api('listArchiveFolder', { folderId: context.folderId, pageSize: ARCHIVE_FOLDER_PAGE_SIZE }, { timeoutMs: 45000 });
      });
      if (rid !== currentRenderId()) return;
      if (wrapped.source === 'fresh' || wrapped.source === 'stale-revalidated' || wrapped.source === 'cache') {
        const result = wrapped.data;
        state.selectedFolderName = result.current ? result.current.name : context.folderName;
        paintArchiveFolderContent(result, context);
      }

      // Drive link is rendered synchronously as Buka Folder Item
    } catch (error) {
      if (rid !== currentRenderId()) return;
      container.innerHTML = `<div class="error">${esc(errorMessage(error))}</div>`;
    }
  }

  function mergeArchiveFolderPage(base, page) {
    base = base || {};
    page = page || {};
    return {
      current: page.current || base.current,
      parent: page.parent || base.parent,
      folders: (base.folders || []).concat(page.folders || []),
      files: (base.files || []).concat(page.files || []),
      nextPageToken: page.nextPageToken || '',
      pageSize: page.pageSize || base.pageSize || ARCHIVE_FOLDER_PAGE_SIZE,
      partial: !!page.nextPageToken
    };
  }

  function bindArchiveFolderSentinelObserver(context) {
    if (archiveFolderObserver) { archiveFolderObserver.disconnect(); archiveFolderObserver = null; }
    const sentinel = document.querySelector('[data-archive-folder-sentinel]');
    if (!sentinel) return;
    const root = document.getElementById('content');
    archiveFolderObserver = new IntersectionObserver(function (entries) {
      if (entries.some(function (e) { return e.isIntersecting; })) {
        loadMoreArchiveFolderContent(context);
      }
    }, { root: root, rootMargin: '300px' });
    archiveFolderObserver.observe(sentinel);
  }

  async function loadMoreArchiveFolderContent(context) {
    if (archiveFolderLoadingMore) return;
    const cacheParams = { folderId: context.folderId, pageSize: ARCHIVE_FOLDER_PAGE_SIZE };
    const cached = getCachedView('archive_folder', cacheParams);
    const currentData = cached && cached.data ? cached.data : null;
    const nextPageToken = currentData && currentData.nextPageToken;
    if (!nextPageToken) return;

    archiveFolderLoadingMore = true;
    // Hentikan observer selama fetch supaya tidak memicu page berikutnya berkali-kali.
    if (archiveFolderObserver) { archiveFolderObserver.disconnect(); archiveFolderObserver = null; }
    try {
      const page = await api('listArchiveFolder', {
        folderId: context.folderId,
        pageSize: ARCHIVE_FOLDER_PAGE_SIZE,
        pageToken: nextPageToken
      }, { timeoutMs: 45000 });
      const merged = mergeArchiveFolderPage(currentData, page);
      setCachedView('archive_folder', cacheParams, merged, getCurrentDataVersion());
      paintArchiveFolderContent(merged, context);
    } catch (error) {
      showToast('Gagal memuat lanjutan folder: ' + errorMessage(error));
      // Error: ganti loader dengan tombol retry manual agar tidak loop terus.
      const sentinel = document.querySelector('[data-archive-folder-sentinel]');
      if (sentinel) {
        sentinel.innerHTML = '<div class="button-row justify-center mt-12"><button class="btn" data-archive-folder-retry>Coba muat lagi</button></div>';
        const retry = sentinel.querySelector('[data-archive-folder-retry]');
        if (retry) retry.addEventListener('click', function () {
          sentinel.innerHTML = loadingHtml('Memuat lebih banyak...');
          loadMoreArchiveFolderContent(context);
        });
      }
    } finally {
      archiveFolderLoadingMore = false;
    }
  }

  /* ── Helper per-region (gaya B: rangka tetap, isi region bisa di-swap) ── */
  function splitArchiveFiles_(result) {
    const allFiles = result.files || [];
    const SHORTCUT_MIME = 'application/vnd.google-apps.shortcut';
    return {
      surat: allFiles.filter(f => f.mimeType !== SHORTCUT_MIME),
      dokumen: allFiles.filter(f => f.mimeType === SHORTCUT_MIME)
    };
  }

  function archiveFoldersSectionHtml(folders, context, suffix) {
    if (!folders.length) return '';
    return `
      <div class="section-header">
        <div>
          <h2 class="section-title">Folder Turunan <span id="archive-folder-count">(${folders.length}${suffix})</span></h2>
        </div>
      </div>
      <div class="folders-grid">
        ${folders.map(folder => archiveChildFolderRow(folder, context)).join('')}
      </div>
    `;
  }

  function archiveSuratBodyHtml(surat) {
    if (surat.length > 0) {
      return `<div class="archive-file-list archive-file-list-scrollable" id="archive-surat-list">${surat.map(file => archiveFileRow(file)).join('')}</div>`;
    }
    return `
      <div class="archive-empty-block">
        <strong>Belum ada item.</strong>
        <span>Klik <strong>Tambah Item</strong> di atas untuk mengarsipkan item pertama di folder ini.</span>
      </div>
    `;
  }

  function archiveDokumenBodyHtml(dokumen) {
    if (dokumen.length > 0) {
      return `<div class="archive-file-list" id="archive-dokumen-list">${dokumen.map(file => archiveDokumenRow(file)).join('')}</div>`;
    }
    return `
      <div class="archive-empty-block">
        <strong>Belum ada dokumen.</strong>
        <span>Klik <strong>Tambah Dokumen</strong> di atas untuk menautkan dokumen Drive ke folder ini.</span>
      </div>
    `;
  }

  function archiveSentinelHtml(hasMore) {
    if (!hasMore) return '';
    return `
      <div class="archive-folder-sentinel" data-archive-folder-sentinel style="padding:16px 0;">
        ${loadingHtml('Memuat lebih banyak...')}
      </div>
    `;
  }

  function archiveFolderContentHtml(result, context) {
    const folders = result.folders || [];
    const split = splitArchiveFiles_(result);
    const surat = split.surat;
    const dokumen = split.dokumen;
    const hasMore = !!result.nextPageToken;
    const suffix = hasMore ? '+' : '';
    return `
      <div id="archive-folders-region">${archiveFoldersSectionHtml(folders, context, suffix)}</div>

      <div class="archive-folder-grid">
        <div>
          <div class="section-header">
            <div>
                <h2 class="section-title">Item <span class="muted" id="archive-surat-count" style="font-size:0.85em;font-weight:400;">(${surat.length}${suffix})</span></h2>
            </div>
          </div>
          <div id="archive-surat-body">${archiveSuratBodyHtml(surat)}</div>
        </div>

        <div>
          <div class="section-header">
            <div>
                <h2 class="section-title">Dokumen <span class="muted" id="archive-dokumen-count" style="font-size:0.85em;font-weight:400;">(${dokumen.length}${suffix})</span></h2>
            </div>
          </div>
          <div id="archive-dokumen-body">${archiveDokumenBodyHtml(dokumen)}</div>
        </div>
      </div>

      ${archiveSentinelHtml(hasMore)}
    `;
  }

  /* Swap bedah: update HANYA isi region (folder grid, daftar surat, daftar
     dokumen, count, sentinel) tanpa membangun ulang seluruh blok. Daftar surat
     punya scroll sendiri — scrollTop-nya dijaga supaya tidak loncat ke atas saat
     auto-refresh. Return false jika rangka belum ada (caller fallback full render). */
  function updateArchiveFolderSections(result, context) {
    const container = document.getElementById('archive-folder-content');
    if (!container) return false;
    const grid = container.querySelector('.archive-folder-grid');
    const suratCount = document.getElementById('archive-surat-count');
    if (!grid || !suratCount) return false; // rangka belum terpasang

    const folders = result.folders || [];
    const split = splitArchiveFiles_(result);
    const surat = split.surat;
    const dokumen = split.dokumen;
    const hasMore = !!result.nextPageToken;
    const suffix = hasMore ? '+' : '';

    const foldersRegion = document.getElementById('archive-folders-region');
    if (foldersRegion) foldersRegion.innerHTML = archiveFoldersSectionHtml(folders, context, suffix);

    suratCount.textContent = `(${surat.length}${suffix})`;
    const suratBody = document.getElementById('archive-surat-body');
    if (suratBody) {
      const existingList = document.getElementById('archive-surat-list');
      if (existingList && surat.length > 0) {
        const prevScroll = existingList.scrollTop;
        existingList.innerHTML = surat.map(file => archiveFileRow(file)).join('');
        existingList.scrollTop = prevScroll; // jaga posisi scroll daftar surat
      } else {
        suratBody.innerHTML = archiveSuratBodyHtml(surat);
      }
    }

    const dokumenCount = document.getElementById('archive-dokumen-count');
    if (dokumenCount) dokumenCount.textContent = `(${dokumen.length}${suffix})`;
    const dokumenBody = document.getElementById('archive-dokumen-body');
    if (dokumenBody) dokumenBody.innerHTML = archiveDokumenBodyHtml(dokumen);

    const oldSentinel = container.querySelector('[data-archive-folder-sentinel]');
    if (oldSentinel) oldSentinel.remove();
    if (hasMore) container.insertAdjacentHTML('beforeend', archiveSentinelHtml(true));

    bindArchiveFolderContent(result, context);
    return true;
  }

  function bindArchiveFolderContent(result, context) {
    bindArchiveFolderSentinelObserver(context);

    var dropdownMenu = document.getElementById('doc-add-dropdown-menu');
    if (dropdownMenu) {
      window.currentArchiveResultFiles = result.files || [];
      var availableCats = getUnfilledDocCategories_(window.currentArchiveResultFiles);
      if (!availableCats || availableCats.length === 0) {
        dropdownMenu.innerHTML = '<div class="sub-dropdown-item small muted" style="pointer-events:none;">Semua dokumen sudah ditambahkan</div>';
      } else {
        dropdownMenu.innerHTML = availableCats.map(function(cat) {
          return '<button class="sub-dropdown-item" data-doc-category="' + esc(cat.id) + '" data-doc-category-name="' + esc(cat.name) + '">' + esc(cat.name) + '</button>';
        }).join('');
      }
    }

    document.querySelectorAll('[data-edit-shortcut]').forEach(function (button) {
      button.addEventListener('click', async function () {
        var fileId = this.dataset.fileId;
        var fileName = this.dataset.fileName;
        this.disabled = true;
        var docLoadToast = showProcessToast('Memuat data dokumen...');
        try {
          var info = await api('getShortcutTargetInfo', { fileId: fileId });
          docLoadToast.hide();
          openArchiveDocLinkModal({
            title: 'Edit Dokumen',
            categoryName: fileName,
            allCategories: getDocCategories_(),
            contextParts: buildArchiveBreadcrumb(context),
            currentUrl: (info && info.targetUrl) || '',
            onSubmit: async function (url, cat) {
              var newCatName = cat ? cat.name : fileName;
              var loadToast = showProcessToast('Menyimpan perubahan dokumen ' + newCatName + '...');
              
              // OPTIMISTIC EDIT
              var rowBtn = document.querySelector(`[data-edit-shortcut][data-file-id="${fileId}"]`);
              var oldName = '';
              if (rowBtn) {
                 var row = rowBtn.closest('.archive-list-row');
                 if (row) {
                    var nameEl = row.querySelector('.archive-row-text strong');
                    if (nameEl) {
                       oldName = nameEl.textContent;
                       nameEl.textContent = newCatName;
                    }
                 }
              }

              try {
                if (newCatName !== fileName) {
                  await api('renameArchiveFile', { fileId: fileId, name: newCatName });
                }
                await api('updateArchiveDocumentLink', {
                  fileId: fileId,
                  url: url,
                  categoryName: newCatName,
                  activityId: context.activity.activity_id,
                  subActivityId: context.subActivity.sub_activity_id,
                  year: state.bootstrap.settings.currentYear
                });
                loadToast.success('Dokumen ' + newCatName + ' berhasil diperbarui!');
                invalidateViewCache('archive_folder');
                loadArchiveFolderContent(context); // Silent reload
              } catch (err) {
                // Restore UI on failure
                if (oldName && rowBtn) {
                   var row = rowBtn.closest('.archive-list-row');
                   if (row) {
                      var nameEl = row.querySelector('.archive-row-text strong');
                      if (nameEl) nameEl.textContent = oldName;
                   }
                }
                loadToast.error('Gagal mengubah ' + newCatName + ': ' + (err.message || String(err)));
              }
            }
          });
        } catch (err) {
          docLoadToast.hide();
          showToast('Gagal memuat info tautan: ' + (err.message || String(err)));
        }
        this.disabled = false;
      });
    });

    document.querySelectorAll('[data-open-folder]').forEach(el => {
      el.addEventListener('click', (e) => {
        if (e.target.closest('.sub-card-actions')) return;
        if (e.target.closest('.archive-row-actions')) return;
        if (e.target.closest('.tall-card-actions')) return;
        const nextName = el.dataset.folderName;
        const mappedSub = findMappedSubActivityForFolder_(context.activity, el.dataset.folderId);
        const nextBreadcrumb = mappedSub
          ? breadcrumbForMappedSubActivity_(context.activity, mappedSub, nextName)
          : buildArchiveBreadcrumb(context).concat(nextName);
        setView('archive_folder', {
          activityId: context.activity.activity_id,
          subActivityId: mappedSub ? mappedSub.sub_activity_id : context.subActivity.sub_activity_id,
          folderId: el.dataset.folderId,
          folderName: nextName,
          folderBreadcrumb: nextBreadcrumb
        });
      });
    });

    document.querySelectorAll('[data-rename-folder]').forEach(button => {
      button.addEventListener('click', (e) => {
        const menu = e.target.closest('.sub-dropdown-menu');
        if (menu) menu.classList.remove('open');
        openArchiveFolderModal({
          mode: 'rename-folder',
          title: 'Ganti Nama Folder',
          label: 'Nama folder',
          value: button.dataset.folderName,
          submitText: 'Simpan',
          payload: { folderId: button.dataset.folderId }
        });
      });
    });

    document.querySelectorAll('[data-edit-sub-folder]').forEach(button => {
      button.addEventListener('click', (e) => {
        const menu = e.target.closest('.sub-dropdown-menu');
        if (menu) menu.classList.remove('open');
        const sub = (context.activity && context.activity.subActivities || [])
          .find(item => item.sub_activity_id === button.dataset.subId) || {};
        openArchiveFolderModal({
          mode: 'edit-sub-activity',
          title: 'Edit Sub-kegiatan',
          label: 'Nama folder Drive',
          value: sub.sub_activity_name || button.dataset.folderName,
          submitText: 'Simpan Sub-kegiatan',
          subActivity: sub,
          payload: {
            activityId: context.activity.activity_id,
            subActivityId: button.dataset.subId
          }
        });
      });
    });

    document.querySelectorAll('[data-edit-metadata]').forEach(button => {
      button.addEventListener('click', async () => {
        const fileId = button.dataset.fileId;
        const fileName = button.dataset.fileName;
        const fileUrl = button.dataset.fileUrl;
        button.disabled = true;
        showProcessToast('Memuat data metadata...');
        try {
          const log = await api('getArchiveLogByFileId', { fileId: fileId });
          if (!log) {
            showToast('Item belum tercatat di log. Mengalihkan ke form pendataan arsip...');
            state.draft = null;
            state.selectedFile = {
              id: fileId,
              name: fileName,
              url: fileUrl,
              mimeType: '',
              fileSize: 0,
              isJustUploaded: false
            };
            state.editMode = false;
            setView('process', {
              preselectedActivityId: context.activity ? context.activity.activity_id : '',
              preselectedSubActivityId: context.subActivity ? context.subActivity.sub_activity_id : '',
              targetFolderId: context.folderId,
              targetFolderName: context.folderName || (context.subActivity ? context.subActivity.sub_activity_name : ''),
              folderBreadcrumb: buildArchiveBreadcrumb(context)
            });
            return;
          }
          const draftObj = await api('getArchiveMetadata', { archiveId: log.archive_id, year: state.bootstrap.settings.currentYear });
          state.draft = draftObj;
          state.editMode = true;
          state.editReturnFolder = {
            activityId: context.activity ? context.activity.activity_id : '',
            subActivityId: context.subActivity ? context.subActivity.sub_activity_id : '',
            folderId: context.folderId,
            folderName: context.folderName || (context.subActivity ? context.subActivity.sub_activity_name : ''),
            folderBreadcrumb: buildArchiveBreadcrumb(context)
          };
          setView('process');
          showToast('Memasuki mode edit metadata...');
        } catch (e) {
          showToast('Gagal memuat data arsip: ' + (e.message || String(e)));
          button.disabled = false;
        }
      });
    });

    document.querySelectorAll('[data-trash-folder]').forEach(button => {
      button.addEventListener('click', async (e) => {
        const menu = e.target.closest('.sub-dropdown-menu');
        if (menu) menu.classList.remove('open');
        if (!await showConfirmModal('Pindahkan folder "' + button.dataset.folderName + '" ke Tempat Sampah?')) return;
        button.disabled = true;
        
        // OPTIMISTIC DELETE
        const row = button.closest('.tall-card') || button.closest('.archive-list-row');
        if (row) row.style.display = 'none';

        const result = await archiveFolderAction('trashArchiveFolder', { folderId: button.dataset.folderId }, context, 'Folder dipindahkan ke Tempat Sampah.', 'Menghapus folder "' + button.dataset.folderName + '"...');
        if (!result && row) row.style.display = ''; // restore on fail
        button.disabled = false;
      });
    });

    document.querySelectorAll('[data-trash-sub-folder]').forEach(button => {
      button.addEventListener('click', async (e) => {
        const menu = e.target.closest('.sub-dropdown-menu');
        if (menu) menu.classList.remove('open');
        if (!await showConfirmModal('Hapus sub-kegiatan "' + button.dataset.folderName + '" dan pindahkan foldernya ke Tempat Sampah?')) return;
        button.disabled = true;

        // OPTIMISTIC DELETE
        const row = button.closest('.tall-card') || button.closest('.archive-list-row');
        if (row) row.style.display = 'none';

        const result = await archiveFolderAction('trashSubActivityFolder', {
          activityId: context.activity.activity_id,
          subActivityId: button.dataset.subId,
          year: state.bootstrap.settings.currentYear
        }, context, 'Sub-kegiatan dihapus.', 'Menghapus sub-kegiatan "' + button.dataset.folderName + '"...');
        
        if (result && result.bootstrap) {
          state.bootstrap = result.bootstrap;
          populateDashboardNav();
        } else if (!result && row) {
          row.style.display = ''; // restore on fail
        }
        button.disabled = false;
      });
    });

    document.querySelectorAll('[data-trash-file]').forEach(button => {
      button.addEventListener('click', async () => {
        if (!await showConfirmModal('Pindahkan dokumen "' + button.dataset.fileName + '" ke Tempat Sampah? Baris spreadsheet akan dihapus beserta pengurutan ulang nomor item.')) return;
        button.disabled = true;

        // OPTIMISTIC DELETE
        const row = button.closest('.archive-list-row');
        if (row) row.style.display = 'none';

        const result = await archiveFolderAction('trashArchiveFile', {
          fileId: button.dataset.fileId,
          activityId: context.activity ? context.activity.activity_id : '',
          subActivityId: context.subActivity ? context.subActivity.sub_activity_id : '',
          year: state.bootstrap.settings.currentYear
        }, context, 'Dokumen dan baris spreadsheet berhasil dihapus.', 'Menghapus dokumen "' + button.dataset.fileName + '"...');
        
        if (!result && row) row.style.display = ''; // restore on fail
        button.disabled = false;
      });
    });
  }

  function openArchiveFolderModal(options) {
    const modal = document.getElementById('archive-folder-modal');
    const title = document.getElementById('archive-modal-title');
    const label = document.getElementById('archive-modal-label');
    const input = document.getElementById('archive-modal-input');
    const submit = document.getElementById('archive-modal-submit');
    const cancel = document.getElementById('archive-modal-cancel');
    const closeBtn = document.getElementById('archive-modal-close');
    const mappingFields = document.getElementById('archive-sub-mapping-fields');
    const formalInput = document.getElementById('archive-sub-formal-name');
    const sheetInput = document.getElementById('archive-sub-sheet-name');
    const noFolderInput = document.getElementById('archive-sub-no-folder');
    const rekapRowInput = document.getElementById('archive-sub-rekap-row');
    const context = getArchiveFolderContext();
    if (!modal || !title || !label || !input || !submit || !cancel) return;

    const isSubActivityEdit = options.mode === 'edit-sub-activity';
    const sub = options.subActivity || {};
    title.textContent = options.title;
    label.textContent = options.label;
    input.value = options.value || '';
    submit.textContent = options.submitText || 'Simpan';
    if (mappingFields) mappingFields.style.display = isSubActivityEdit ? 'block' : 'none';
    if (formalInput) formalInput.value = isSubActivityEdit ? (sub.formal_archive_name || sub.effective_formal_archive_name || sub.sub_activity_name || '') : '';
    if (sheetInput) sheetInput.value = isSubActivityEdit ? (sub.target_sheet_name || sub.effective_target_sheet_name || sub.sub_activity_name || '') : '';
    if (noFolderInput) noFolderInput.value = isSubActivityEdit ? (sub.no_folder || '') : '';
    if (rekapRowInput) rekapRowInput.value = isSubActivityEdit ? (sub.rekap_row_number || '') : '';
    modal.style.display = 'grid';
    window.setTimeout(() => input.focus(), 30);

    const close = () => {
      modal.style.display = 'none';
      submit.onclick = null;
      cancel.onclick = null;
      if(closeBtn) closeBtn.onclick = null;
      modal.onclick = null;
    };
    cancel.onclick = close;
    if(closeBtn) closeBtn.onclick = close;
    modal.onclick = (event) => { if (event.target === modal) close(); };
    submit.onclick = async () => {
      const name = input.value.trim();
      if (!name) {
        showToast('Nama wajib diisi.');
        return;
      }
      submit.disabled = true;
      try {
        if (options.mode === 'add-folder') {
          await api('addArchiveChildFolder', Object.assign({}, options.payload, { name }));
          const targetRootId = context.activity
            ? String(context.activity.target_folder_id || (context.activity.targetFolder && context.activity.targetFolder.id) || '')
            : '';
          const isAddingKepemimpinanSubActivity = context.activity &&
            context.activity.activity_id === 'kepemimpinan' &&
            String(context.folderId || '') === targetRootId;
          if (isAddingKepemimpinanSubActivity) {
            const syncResult = await api('syncSubActivities', {
              activityId: context.activity.activity_id,
              year: state.bootstrap.settings.currentYear
            });
            if (syncResult && syncResult.bootstrap) {
              state.bootstrap = syncResult.bootstrap;
              populateDashboardNav();
            }
            showToast('Folder angkatan ditambahkan dan dipetakan ke lembar kerja.');
          } else {
            showToast('Folder turunan ditambahkan.');
          }
        } else if (options.mode === 'rename-folder') {
          await api('renameArchiveFolder', Object.assign({}, options.payload, { name }));
          showToast('Nama folder diperbarui.');
        } else if (options.mode === 'edit-sub-activity') {
          const result = await api('renameSubActivity', Object.assign({}, options.payload, {
            newName: name,
            formalArchiveName: formalInput ? formalInput.value.trim() : '',
            targetSheetName: sheetInput ? sheetInput.value.trim() : '',
            noFolder: noFolderInput ? noFolderInput.value.trim() : '',
            rekapRowNumber: rekapRowInput ? rekapRowInput.value.trim() : '',
            mappingStatus: 'SIAP',
            year: state.bootstrap.settings.currentYear
          }));
          if (result && result.bootstrap) {
            state.bootstrap = result.bootstrap;
            populateDashboardNav();
          }
          showToast('Sub-kegiatan dan rangkuman diperbarui.');
        }
        close();
        invalidateViewCache('archive_folder');
        await loadArchiveFolderContent(context);
      } catch (error) {
        showToast(errorMessage(error));
      } finally {
        submit.disabled = false;
      }
    };
  }

  async function archiveFolderAction(apiName, payload, context, successMessage, loadingMessage) {
    var actionToast = showProcessToast(loadingMessage || 'Memproses...', true);
    try {
      const result = await api(apiName, payload);
      invalidateViewCache('archive_folder');
      await loadArchiveFolderContent(context);
      if (actionToast) removeToast(actionToast);
      showToast(successMessage);
      return result;
    } catch (error) {
      if (actionToast) removeToast(actionToast);
      showToast(errorMessage(error));
      return null;
    }
  }




  function archiveDocLinkModalHtml() {
    return `
      <div id="archive-doc-link-modal" class="modal-backdrop" style="display:none; z-index: 1000;">
        <div class="modal-card" style="width: min(520px, 95dvw); display: flex; flex-direction: column;">
          <div class="modal-header">
            <h3 class="section-title" id="doc-link-modal-title">Tambah Dokumen</h3>
            <button class="btn icon-btn" id="doc-link-modal-close" aria-label="Tutup">x</button>
          </div>
          <div class="panel-pad">
            <div id="doc-link-modal-context" class="small mb-12" style="font-weight: 500;"></div>
            <div class="form-field">
              <label for="doc-link-modal-category">Pilih Kategori Dokumen</label>
              <select id="doc-link-modal-category"></select>
            </div>
            <div class="form-field mt-12">
              <label for="doc-link-modal-url">Tautan Google Drive</label>
              <div class="drive-link-input" style="width: 100%;">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M10 13a5 5 0 0 0 7.1 0l2.4-2.4a5 5 0 0 0-7.1-7.1L11 4.9"/>
                  <path d="M14 11a5 5 0 0 0-7.1 0l-2.4 2.4a5 5 0 0 0 7.1 7.1L13 19.1"/>
                </svg>
                <input id="doc-link-modal-url" type="url" inputmode="url" autocomplete="off" spellcheck="false" placeholder="Contoh: drive.google.com/..." style="width: 100%; border: none; outline: none; background: transparent;">
              </div>
              <div class="small muted mt-4">Pilih kategori dokumen dan tempel tautannya di atas.</div>
            </div>
            <div class="button-row justify-end mt-20">
              <button class="btn" id="doc-link-modal-cancel">Batal</button>
              <button class="btn btn-primary" id="doc-link-modal-submit">Simpan</button>
            </div>
          </div>
        </div>
      </div>
    `;
  }

  function openArchiveDocLinkModal(options) {
    var modal = document.getElementById('archive-doc-link-modal');
    if (!modal) {
      document.body.insertAdjacentHTML('beforeend', archiveDocLinkModalHtml());
      modal = document.getElementById('archive-doc-link-modal');
    }
    var titleEl = document.getElementById('doc-link-modal-title');
    var contextEl = document.getElementById('doc-link-modal-context');
    var categorySelect = document.getElementById('doc-link-modal-category');
    var urlInput = document.getElementById('doc-link-modal-url');
    var submitBtn = document.getElementById('doc-link-modal-submit');
    var cancelBtn = document.getElementById('doc-link-modal-cancel');
    var closeBtn = document.getElementById('doc-link-modal-close');

    titleEl.textContent = options.title || 'Tambah Dokumen';
    contextEl.innerHTML = (options.contextParts || []).map(function(p) { return '<span>' + esc(p) + '</span>'; }).join('<span class="mx-4">/</span>');
    urlInput.value = options.currentUrl || '';

    categorySelect.innerHTML = '';
    (options.allCategories || []).forEach(function(cat) {
      var opt = document.createElement('option');
      opt.value = cat.id;
      opt.textContent = cat.name;
      if (cat.name === options.categoryName) opt.selected = true;
      categorySelect.appendChild(opt);
    });

    submitBtn.textContent = 'Simpan';
    submitBtn.disabled = false;
    modal.style.display = 'grid';

    window.setTimeout(function() { urlInput.focus(); }, 50);

    var closeModal = function() {
      modal.style.opacity = '0';
      setTimeout(function() {
        modal.style.display = 'none';
        modal.style.opacity = '1';
        submitBtn.onclick = null;
        cancelBtn.onclick = null;
        closeBtn.onclick = null;
      }, 200);
    };

    var handleSubmit = function() {
      var url = urlInput.value.trim();
      if (!url) { showToast('Tautan Drive wajib diisi.'); return; }
      if (!url.startsWith('http')) { showToast('Tautan harus berupa URL yang valid (http/https).'); return; }
      
      var selectedId = categorySelect.value;
      var selectedCat = (options.allCategories || []).find(function(c) { return c.id === selectedId; });
      
      submitBtn.disabled = true;
      submitBtn.textContent = 'Menyimpan...';
      
      closeModal();
      
      if (typeof options.onSubmit === 'function') {
        options.onSubmit(url, selectedCat);
      }
    };

    cancelBtn.onclick = closeModal;
    closeBtn.onclick = closeModal;
    submitBtn.onclick = handleSubmit;
  }

</script>
