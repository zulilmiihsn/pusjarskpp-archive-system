<script>
  var _currentEditSub = null;
  var _currentMetadataLocks = {};

  function openEditSubModal(activity, sub, forceParentName) {
    _currentEditSub = { activity: activity, sub: sub, forceParentName: forceParentName };
    var isAddMode = !sub;
    try {
      _currentMetadataLocks = sub && sub.metadata_locks ? JSON.parse(sub.metadata_locks) : {};
    } catch(e) {
      _currentMetadataLocks = {};
    }
    var renameModal = document.getElementById('rename-sub-modal');
    var renameInput = document.getElementById('rename-sub-name');
    var renameFormalInput = document.getElementById('rename-sub-formal-name');
    var renameSheetInput = document.getElementById('rename-sub-sheet-name');
    var renameNoFolderInput = document.getElementById('rename-sub-no-folder');

    renameInput.value = sub ? (sub.sub_activity_name || '') : '';
    if (renameFormalInput) renameFormalInput.value = sub ? (sub.formal_archive_name || sub.effective_formal_archive_name || sub.sub_activity_name || '') : '';
    if (renameSheetInput) renameSheetInput.value = sub ? (sub.target_sheet_name || sub.effective_target_sheet_name || sub.sub_activity_name || '') : '';
    if (renameNoFolderInput) renameNoFolderInput.value = sub ? (sub.no_folder || '') : '';

    ['rename-sub-nomor-berkas','rename-sub-kode-klasifikasi','rename-sub-kurun-start','rename-sub-kurun-end',
     'rename-sub-no-filing-cabinet','rename-sub-no-laci','rename-sub-keterangan','rename-sub-jumlah'].forEach(function (id) {
      var el = document.getElementById(id);
      if (el) el.value = '';
    });
    var aksesEl = document.getElementById('rename-sub-klasifikasi-akses');
    if (aksesEl) aksesEl.value = 'Terbatas';

    // Set title and button text based on mode
    var titleEl = renameModal.querySelector('.modal-header .section-title');
    if (titleEl) titleEl.textContent = isAddMode ? 'Tambah Sub-kegiatan' : 'Edit Sub-kegiatan';
    var submitBtn = document.getElementById('btn-submit-rename-sub');
    if (submitBtn) submitBtn.textContent = isAddMode ? 'Buat Sub-kegiatan' : 'Simpan Sub-kegiatan';
    if (isAddMode && forceParentName) {
        _currentEditSub.forceParentName = forceParentName;
    }

    renameModal.style.display = 'grid';
    renameInput.focus();

    updateLockUI_('kurunWaktu', _currentMetadataLocks.kurunWaktu !== false);
    updateLockUI_('akses', _currentMetadataLocks.akses !== false);
    updateLockUI_('jumlah', _currentMetadataLocks.jumlah !== false);
    updateLockUI_('nomorBerkas', _currentMetadataLocks.nomorBerkas !== false);
    updateLockUI_('filingCabinet', _currentMetadataLocks.filingCabinet !== false);
    updateLockUI_('noLaci', _currentMetadataLocks.noLaci !== false);
    updateLockUI_('noFolder', _currentMetadataLocks.noFolder !== false);

    setMetadataSectionLoading_(true);
    if (!isAddMode) {
      loadEditSubDefaults_(activity, sub);
    } else {
      setMetadataSectionLoading_(false);
    }
  }

  function setMetadataSectionLoading_(isLoading) {
    var section = document.getElementById('rename-sub-metadata-section');
    if (section) {
      section.disabled = isLoading;
      section.style.opacity = isLoading ? '0.4' : '1';
    }
    var submitBtn = document.getElementById('btn-submit-rename-sub');
    if (submitBtn) {
      submitBtn.disabled = isLoading;
    }
    var spinner = document.getElementById('rename-sub-metadata-spinner');
    if (spinner) {
      spinner.style.display = isLoading ? 'flex' : 'none';
    }
  }

  async function loadEditSubDefaults_(activity, sub) {
    try {
      var year = state.bootstrap.settings.currentYear;
      var res = await api('getArchiveMetadataDefaults', {
        year: year, activityId: activity.activity_id, subActivityId: sub.sub_activity_id
      });
      var meta = res && res.metadata ? res.metadata : {};
      var nEl = document.getElementById('rename-sub-nomor-berkas');
      var kEl = document.getElementById('rename-sub-kode-klasifikasi');
      var ksEl = document.getElementById('rename-sub-kurun-start');
      var keEl = document.getElementById('rename-sub-kurun-end');
      var cfEl = document.getElementById('rename-sub-no-filing-cabinet');
      var lEl = document.getElementById('rename-sub-no-laci');
      var aEl = document.getElementById('rename-sub-klasifikasi-akses');
      var ketEl = document.getElementById('rename-sub-keterangan');
      var jEl = document.getElementById('rename-sub-jumlah');
      var nfEl = document.getElementById('rename-sub-no-folder');
      
      if (nEl) nEl.value = meta.no_berkas || sub.sort_order || '';
      var kurunParts = String(meta.kurun_waktu || '').trim().split(/\s+-\s+/);
      if (ksEl) ksEl.value = parseKurunDate_(kurunParts[0] || '');
      if (keEl) keEl.value = parseKurunDate_(kurunParts[1] || '');
      if (cfEl) cfEl.value = meta.no_filing_cabinet || '';
      if (lEl) lEl.value = meta.no_laci || (activity ? activity.laci_no : '') || '';
      if (aEl && meta.klasifikasi_akses) aEl.value = meta.klasifikasi_akses;
      if (ketEl) ketEl.value = meta.ket || '';
      if (jEl) jEl.value = meta.jumlah || '';
      if (nfEl && !nfEl.value) nfEl.value = meta.no_folder || sub.no_folder || '';
    } catch (e) {
    } finally {
      setMetadataSectionLoading_(false);
    }
  }

  function parseKurunDate_(text) {
    var val = String(text || '').trim();
    if (!val) return '';
    if (/^\d{4}-\d{2}-\d{2}$/.test(val)) return val;
    var months = {januari:'01',februari:'02',maret:'03',april:'04',mei:'05',juni:'06',juli:'07',agustus:'08',september:'09',oktober:'10',november:'11',desember:'12'};
    var m = val.toLowerCase().match(/^(\d{1,2})\s+([a-z]+)\s+(\d{4})$/);
    if (!m || !months[m[2]]) return '';
    return m[3] + '-' + months[m[2]] + '-' + String(m[1]).padStart(2, '0');
  }

  async function toggleLock_(field) {
    var isCurrentlyLocked = (_currentMetadataLocks[field] !== false);
    var newLockState = !isCurrentlyLocked;
    _currentMetadataLocks[field] = newLockState;
    updateLockUI_(field, newLockState);

    if (newLockState === false && _currentEditSub) {
      var processToast = showProcessToast('Menghitung nilai default dari detail sheet...');
      try {
        var year = state.bootstrap.settings.currentYear;
        var res = await api('getArchiveMetadataDefaults', {
          year: year,
          activityId: _currentEditSub.activity.activity_id,
          subActivityId: _currentEditSub.sub.sub_activity_id,
          forceCalculate: true
        });
        var meta = res && res.metadata ? res.metadata : {};
        if (field === 'kurunWaktu') {
          var ksEl = document.getElementById('rename-sub-kurun-start');
          var keEl = document.getElementById('rename-sub-kurun-end');
          var kurunParts = String(meta.kurun_waktu || '').trim().split(/\s+-\s+/);
          if (ksEl) ksEl.value = parseKurunDate_(kurunParts[0] || '');
          if (keEl) keEl.value = parseKurunDate_(kurunParts[1] || '');
        } else if (field === 'akses') {
          var aEl = document.getElementById('rename-sub-klasifikasi-akses');
          if (aEl && meta.klasifikasi_akses) aEl.value = meta.klasifikasi_akses;
        } else if (field === 'jumlah') {
          var jEl = document.getElementById('rename-sub-jumlah');
          if (jEl && meta.jumlah) jEl.value = meta.jumlah;
        } else if (field === 'nomorBerkas') {
          var nbEl = document.getElementById('rename-sub-nomor-berkas');
          if (nbEl) nbEl.value = meta.no_berkas || (_currentEditSub.sub ? _currentEditSub.sub.sort_order : '') || '';
        } else if (field === 'filingCabinet') {
          var cfEl = document.getElementById('rename-sub-no-filing-cabinet');
          if (cfEl) cfEl.value = meta.no_filing_cabinet || '';
        } else if (field === 'noLaci') {
          var lEl = document.getElementById('rename-sub-no-laci');
          if (lEl) lEl.value = meta.no_laci || '';
        } else if (field === 'noFolder') {
          var nfEl = document.getElementById('rename-sub-no-folder');
          if (nfEl) nfEl.value = meta.no_folder || (_currentEditSub.sub ? _currentEditSub.sub.sort_order : '') || '';
        }
        removeToast(processToast);
      } catch (e) {
        showToast('Gagal menghitung nilai default: ' + e.message);
      }
    }
  }

  var SVG_LOCK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>';
  var SVG_UNLOCK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 9.9-1"></path></svg>';

  function updateLockUI_(field, isLocked) {
    var btn = document.getElementById('btn-lock-' + (field === 'kurunWaktu' ? 'kurun' : field));
    if (!btn) return;
    btn.innerHTML = isLocked ? SVG_LOCK : SVG_UNLOCK;
    btn.title = isLocked ? 'Mode Formula. Klik untuk ubah manual.' : 'Mode Manual. Klik untuk kunci ke formula.';

    if (field === 'kurunWaktu') {
      var startEl = document.getElementById('rename-sub-kurun-start');
      var endEl = document.getElementById('rename-sub-kurun-end');
      if (startEl) startEl.disabled = isLocked;
      if (endEl) endEl.disabled = isLocked;
    } else if (field === 'akses') {
      var aksesEl = document.getElementById('rename-sub-klasifikasi-akses');
      if (aksesEl) aksesEl.disabled = isLocked;
    } else if (field === 'jumlah') {
      var jEl = document.getElementById('rename-sub-jumlah');
      if (jEl) jEl.disabled = isLocked;
    } else if (field === 'nomorBerkas') {
      var nbEl = document.getElementById('rename-sub-nomor-berkas');
      if (nbEl) nbEl.disabled = isLocked;
    } else if (field === 'filingCabinet') {
      var fcEl = document.getElementById('rename-sub-no-filing-cabinet');
      if (fcEl) fcEl.disabled = isLocked;
    } else if (field === 'noLaci') {
      var nlEl = document.getElementById('rename-sub-no-laci');
      if (nlEl) nlEl.disabled = isLocked;
    } else if (field === 'noFolder') {
      var nfEl = document.getElementById('rename-sub-no-folder');
      if (nfEl) nfEl.disabled = isLocked;
    }
  }

  function closeEditSubModal() {
    document.getElementById('rename-sub-modal').style.display = 'none';
    _currentEditSub = null;
  }

  async function submitEditSub() {
    if (!_currentEditSub) return;
    var activity = _currentEditSub.activity;
    var sub = _currentEditSub.sub;
    var submitBtn = document.getElementById('btn-submit-rename-sub');
    var newName = document.getElementById('rename-sub-name').value.trim();
    if (!newName) { showToast('Nama sub-kegiatan wajib diisi.'); return; }

    var isAddMode = !sub;

    submitBtn.disabled = true;
    submitBtn.textContent = 'Menyimpan...';
    var year = state.bootstrap.settings.currentYear;

    function formatKurunDate_(isoDate) {
      if (!isoDate) return '';
      var parts = String(isoDate).split('-');
      if (parts.length !== 3) return '';
      var months = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
      var idx = Number(parts[1]) - 1;
      if (idx < 0 || idx > 11) return '';
      return String(Number(parts[2])) + ' ' + months[idx] + ' ' + parts[0];
    }

    var startText = formatKurunDate_(document.getElementById('rename-sub-kurun-start').value);
    var endText = formatKurunDate_(document.getElementById('rename-sub-kurun-end').value);
    var kurunWaktu = startText && endText ? startText + ' - ' + endText : (startText || endText || '');

    try {
      var result;
      if (isAddMode) {
        result = await api('addSubActivity', {
          activityId: activity.activity_id,
          subActivityName: newName,
          formalArchiveName: (document.getElementById('rename-sub-formal-name') || {}).value || '',
          targetSheetName: (document.getElementById('rename-sub-sheet-name') || {}).value || '',
          noFolder: (document.getElementById('rename-sub-no-folder') || {}).value || '',
          parentFolderName: _currentEditSub.forceParentName || '',
          year: year
        });
      } else {
        result = await api('renameSubActivity', {
          activityId: activity.activity_id,
          subActivityId: sub.sub_activity_id,
          newName: newName,
          formalArchiveName: (document.getElementById('rename-sub-formal-name') || {}).value || '',
          targetSheetName: (document.getElementById('rename-sub-sheet-name') || {}).value || '',
          noFolder: (document.getElementById('rename-sub-no-folder') || {}).value || '',
          mappingStatus: 'SIAP',
          year: year
        });
      }
      
      state.bootstrap = result.bootstrap;
      var targetSubId = isAddMode ? result.subActivity.sub_activity_id : sub.sub_activity_id;

      if (targetSubId) {
        await api('updateSubActivityMetadata', {
          activityId: activity.activity_id,
          subActivityId: targetSubId,
          nomorBerkas: document.getElementById('rename-sub-nomor-berkas').value.trim(),
          kurunWaktu: kurunWaktu,
          noFilingCabinet: document.getElementById('rename-sub-no-filing-cabinet').value.trim(),
          noLaci: document.getElementById('rename-sub-no-laci').value.trim(),
          noFolder: document.getElementById('rename-sub-no-folder').value.trim(),
          klasifikasiAkses: document.getElementById('rename-sub-klasifikasi-akses').value,
          ket: document.getElementById('rename-sub-keterangan').value.trim(),
          jumlah: document.getElementById('rename-sub-jumlah').value.trim(),
          metadataLocks: JSON.stringify(_currentMetadataLocks),
          year: year
        });
      }

      closeEditSubModal();

      if (state.view === 'archive_folder' && typeof renderArchiveFolder === 'function') {
        renderArchiveFolder();
      } else if (typeof renderActivityDetail === 'function') {
        renderActivityDetail();
      } else if (typeof render === 'function') {
        render();
      }
      showToast('Sub-kegiatan berhasil diperbarui.');
    } catch (error) {
      showToast('Gagal: ' + (errorMessage(error)));
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = isAddMode ? 'Buat Sub-kegiatan' : 'Simpan Sub-kegiatan';
    }
  }
</script>

<div id="rename-sub-modal" class="modal-backdrop" style="display: none;">
  <div class="modal-card" style="width: min(520px, 100%);">
    <div class="modal-header">
      <h3 class="section-title">Edit Sub-kegiatan</h3>
      <button class="btn icon-btn" id="btn-cancel-rename-sub-icon" onclick="closeEditSubModal()" aria-label="Tutup">x</button>
    </div>
    <div class="panel-pad">
      <p class="small muted mb-16">Ubah identitas dan metadata sub-kegiatan sebagai satu paket. Perubahan akan disinkronkan ke folder Drive, lembar rincian, dan baris rangkuman.</p>

      <div class="form-field">
        <label for="rename-sub-name">Nama folder Drive</label>
        <input type="text" id="rename-sub-name">
      </div>
      <div class="form-field mt-12">
        <label for="rename-sub-formal-name">Nama formal di rangkuman</label>
        <input type="text" id="rename-sub-formal-name">
      </div>
      <div class="form-field mt-12">
        <label for="rename-sub-sheet-name">Lembar rincian</label>
        <input type="text" id="rename-sub-sheet-name">
      </div>

      <div style="position: relative;">
        <fieldset id="rename-sub-metadata-section" style="border: none; padding: 0; margin: 0; min-width: 0; transition: opacity 0.2s ease;">
          <hr style="margin: 18px 0; border: none; border-top: 1px solid var(--border);">

          <div style="display:grid; grid-template-columns: 1fr 1fr 1fr; gap:12px;">
            <div class="form-field" style="margin:0;">
              <label for="rename-sub-nomor-berkas">
                <span>Nomor Berkas</span>
                <button class="metadata-lock-btn" id="btn-lock-nomorBerkas" type="button" onclick="toggleLock_('nomorBerkas')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg></button>
              </label>
              <input type="text" id="rename-sub-nomor-berkas" placeholder="Otomatis" autocomplete="off">
            </div>
            <div class="form-field" style="margin:0;">
              <label for="rename-sub-jumlah">
                <span>Jumlah</span>
                <button class="metadata-lock-btn" id="btn-lock-jumlah" type="button" onclick="toggleLock_('jumlah')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg></button>
              </label>
              <input type="text" id="rename-sub-jumlah" placeholder="Otomatis" autocomplete="off">
            </div>
          </div>
          <div style="display:grid; grid-template-columns: 1fr 1fr; gap:12px;" class="mt-12">
            <div class="form-field" style="margin:0;">
              <label for="rename-sub-kurun-start">
                <span>Kurun Waktu Mulai</span>
                <button class="metadata-lock-btn" id="btn-lock-kurun" type="button" onclick="toggleLock_('kurunWaktu')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg></button>
              </label>
              <input type="date" id="rename-sub-kurun-start" autocomplete="off">
            </div>
            <div class="form-field" style="margin:0;">
              <label for="rename-sub-kurun-end">Kurun Waktu Selesai</label>
              <input type="date" id="rename-sub-kurun-end" autocomplete="off">
            </div>
          </div>
          <div style="display:grid; grid-template-columns: 1fr 1fr 1fr; gap:12px;" class="mt-12">
            <div class="form-field" style="margin:0;">
              <label for="rename-sub-no-filing-cabinet">
                <span>No. FC</span>
                <button class="metadata-lock-btn" id="btn-lock-filingCabinet" type="button" onclick="toggleLock_('filingCabinet')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg></button>
              </label>
              <input type="text" id="rename-sub-no-filing-cabinet" placeholder="Otomatis" autocomplete="off">
            </div>
            <div class="form-field" style="margin:0;">
              <label for="rename-sub-no-laci">
                <span>Nomor Laci</span>
                <button class="metadata-lock-btn" id="btn-lock-noLaci" type="button" onclick="toggleLock_('noLaci')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg></button>
              </label>
              <input type="text" id="rename-sub-no-laci" placeholder="Otomatis" autocomplete="off">
            </div>
            <div class="form-field" style="margin:0;">
              <label for="rename-sub-no-folder">
                <span>Nomor Folder</span>
                <button class="metadata-lock-btn" id="btn-lock-noFolder" type="button" onclick="toggleLock_('noFolder')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg></button>
              </label>
              <input type="text" id="rename-sub-no-folder" placeholder="Otomatis" autocomplete="off">
            </div>
          </div>
          <div class="form-field mt-12">
            <label for="rename-sub-klasifikasi-akses">
              <span>Keamanan &amp; Akses Arsip</span>
              <button class="metadata-lock-btn" id="btn-lock-akses" type="button" onclick="toggleLock_('akses')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg></button>
            </label>
            <select id="rename-sub-klasifikasi-akses">
              <option value="Terbatas">Terbatas</option>
              <option value="Biasa">Biasa</option>
              <option value="Terbuka">Terbuka</option>
              <option value="Rahasia">Rahasia</option>
              <option value="Penting">Penting</option>
            </select>
          </div>
          <div class="form-field mt-12">
            <label for="rename-sub-keterangan">Keterangan <span class="muted small">(opsional)</span></label>
            <input type="text" id="rename-sub-keterangan" placeholder="Keterangan tambahan..." autocomplete="off">
          </div>


        </fieldset>
        <div id="rename-sub-metadata-spinner" style="display: none; position: absolute; top: 0; left: 0; right: 0; bottom: 0; align-items: center; justify-content: center; pointer-events: none; z-index: 10;">
          <div class="modern-spinner"><div class="modern-spinner-ring"></div></div>
        </div>
      </div>
      <div class="button-row mt-24 justify-end">
        <button class="btn" onclick="closeEditSubModal()">Batal</button>
        <button class="btn btn-primary" id="btn-submit-rename-sub" onclick="submitEditSub()">Simpan Sub-kegiatan</button>
      </div>
    </div>
  </div>
</div>
