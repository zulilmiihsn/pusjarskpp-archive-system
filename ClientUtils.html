<script>
  function getActivity(activityId) {
    return (state.bootstrap.activities || []).find(activity => activity.activity_id === activityId);
  }

  function getActivityName(activityId) {
    const act = getActivity(activityId);
    return act ? act.activity_name : activityId;
  }

  function getActivityColor(activityId) {
    const activeTheme = localStorage.getItem('portal_theme') || 'sleek';
    if (activeTheme === 'custom') {
      const customColors = JSON.parse(localStorage.getItem('portal_custom_colors') || '{"kepemimpinan":"#10B981","latsar":"#F43F5E","teknis":"#F59E0B","lain":"#8B5CF6"}');
      const key = {
        kepemimpinan: 'kepemimpinan',
        latsar_cpns: 'latsar',
        teknis: 'teknis',
        lain_lain: 'lain'
      }[activityId];
      if (key && customColors[key]) {
        return customColors[key];
      }
    }
    if (activeTheme === 'earthy') {
      return {
        kepemimpinan: '#059669',
        latsar_cpns:  '#C2410C',
        teknis:       '#A16207',
        lain_lain:    '#7E22CE'
      }[activityId] || 'var(--accent)';
    }
    if (activeTheme === 'nordic') {
      return {
        kepemimpinan: '#0891B2',
        latsar_cpns:  '#BE185D',
        teknis:       '#B45309',
        lain_lain:    '#4338CA'
      }[activityId] || 'var(--accent)';
    }
    // sleek (default)
    return {
      kepemimpinan: '#10B981',
      latsar_cpns:  '#F43F5E',
      teknis:       '#F59E0B',
      lain_lain:    '#8B5CF6'
    }[activityId] || 'var(--accent)';
  }

  function getSubActivityName(activityId, subActivityId) {
    const act = getActivity(activityId);
    if (!act) return subActivityId;
    const sub = (act.subActivities || []).find(s => s.sub_activity_id === subActivityId);
    return sub ? sub.sub_activity_name : subActivityId;
  }

  function sanitizeFilePart(str) {
    return String(str || '').replace(/[\\/:*?"<>|]/g, '-').replace(/\s+/g, ' ').trim();
  }

  async function getFinalFileName(metadata, sourceName) {
    try {
      const extMatch = String(sourceName || '').match(/\.[a-z0-9]+$/i);
      const ext = extMatch ? extMatch[0].toLowerCase() : '.pdf';
      const item = String(metadata.nomor_item_arsip || '01').padStart(2, '0');
      const tingkat = metadata.tingkat_perkembangan || 'Asli';
      const nomor = metadata.nomor_surat || '';
      const uraian = sanitizeFilePart(metadata.uraian_informasi_item || 'Dokumen Surat');

      if (nomor) {
        return item + '. (' + tingkat + ') No: ' + nomor + '_' + uraian + ext;
      }
      return item + '. (' + tingkat + ') ' + uraian + ext;
    } catch (e) {
      console.warn('getFinalFileName local error:', e.message);
      return sourceName || 'dokumen.pdf';
    }
  }

    const icon = options.icon || '';

    const extraClass = options.extraClass || '';
    const headerClass = options.headerClass || '';

    return `
      <div class="settings-section-card app-page-card ${esc(extraClass)}">
        <div class="settings-section-header settings-section-header-action app-page-card-header ${esc(headerClass)}">
          <div class="app-page-card-title-group">
            <h3 class="settings-section-title">
              ${icon ? '<span class="app-page-card-icon" aria-hidden="true">' + icon + '</span>' : ''}

          </div>
          ${actions ? '<div class="button-row app-page-card-actions">' + actions + '</div>' : ''}
        </div>
        <div class="app-page-card-body">
          ${body}
        </div>

  function showConfirmModal(message) {
    return new Promise((resolve) => {
      const existing = document.getElementById('confirm-modal-root');
      if (existing) existing.remove();
      const host = document.createElement('div');
      host.id = 'confirm-modal-root';
      host.innerHTML = `
        <div class="modal-backdrop" style="z-index:99999;">
          <div class="modal-card" style="max-width:400px;">
            <div class="modal-header">
              <h3 class="section-title">Konfirmasi</h3>
              <button class="btn icon-btn" id="confirm-modal-close" aria-label="Tutup">x</button>
            </div>
            <div class="panel-pad">
              <p class="mb-16">${esc(message)}</p>
              <div class="button-row justify-end">
                <button class="btn" id="confirm-modal-no">Batal</button>
                <button class="btn btn-primary" id="confirm-modal-yes" style="background:#DC2626;border-color:#DC2626;">Ya, Lanjutkan</button>
              </div>
            </div>
          </div>
        </div>
      `;
      document.body.appendChild(host);
      const close = () => { host.remove(); resolve(false); };
      host.querySelector('#confirm-modal-close').onclick = close;
      host.querySelector('#confirm-modal-no').onclick = close;
      host.querySelector('#confirm-modal-yes').onclick = () => { host.remove(); resolve(true); };
      host.querySelector('.modal-backdrop').onclick = (e) => { if (e.target === e.currentTarget) close(); };
    });
  }

  function loadingHtml(msg) {
    msg = msg || 'Memuat data...';
    return '<div class="app-loading">' +
      '<div class="modern-spinner"><div class="modern-spinner-ring"></div></div>' +
      '<div class="app-loading-text">' + esc(msg) + '</div>' +
    '</div>';
  }

  function showLoading(msg) {
    setContent(loadingHtml(msg));
  }

  function normalizeDateToIso(value) {
    if (value == null || value === '') {
      return new Date().toISOString().slice(0, 10);
    }
    
    const valStr = String(value).trim();
    if (/^\d{4}-\d{2}-\d{2}$/.test(valStr)) {
      return valStr;
    }
    
    const parsedMs = Date.parse(valStr);
    if (!isNaN(parsedMs)) {
      return new Date(parsedMs).toISOString().slice(0, 10);
    }
    
    const dmyMatch = valStr.match(/^(\d{1,2})[-/](\d{1,2})[-/](\d{4})$/);
    if (dmyMatch) {
      const day = dmyMatch[1].padStart(2, '0');
      const month = dmyMatch[2].padStart(2, '0');
      const year = dmyMatch[3];
      return `${year}-${month}-${day}`;
    }
    
    const dmyShortMatch = valStr.match(/^(\d{1,2})[-/](\d{1,2})[-/](\d{2})$/);
    if (dmyShortMatch) {
      const day = dmyShortMatch[1].padStart(2, '0');
      const month = dmyShortMatch[2].padStart(2, '0');
      const year = '20' + dmyShortMatch[3];
      return `${year}-${month}-${day}`;
    }

    const indoMonths = {
      'januari': '01', 'jan': '01',
      'februari': '02', 'feb': '02',
      'maret': '03', 'mar': '03',
      'april': '04', 'apr': '04',
      'mei': '05',
      'juni': '06', 'jun': '06',
      'juli': '07', 'jul': '07',
      'agustus': '08', 'agt': '08', 'ags': '08',
      'september': '09', 'sep': '09',
      'oktober': '10', 'okt': '10',
      'november': '11', 'nov': '11',
      'desember': '12', 'des': '12'
    };

    const wordMatch = valStr.match(/^(\d{1,2})[\s-]([a-zA-Z]+)[\s-](\d{4})$/);
    if (wordMatch) {
      const day = wordMatch[1].padStart(2, '0');
      const monthWord = wordMatch[2].toLowerCase();
      const year = wordMatch[3];
      const month = indoMonths[monthWord];
      if (month) {
        return `${year}-${month}-${day}`;
      }
    }

    return new Date().toISOString().slice(0, 10);
  }
