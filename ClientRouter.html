<script>
  // Aset background berat (gedung + ornamen) dimuat LAZY dari server, bukan
  // di-inline ke payload HTML awal. Hasilnya di-cache di memori per sesi.
  var __heavyAssets = null;
  var __heavyAssetsLoading = false;

  function applyBgImages(assets) {
    if (!assets) return;
    if (document.getElementById('bg-image-style')) return;
    var style = document.createElement('style');
    style.id = 'bg-image-style';
    var css = '';
    if (assets.gedungUtama) css += '.tall-card-bg { background-image: url(\'' + assets.gedungUtama + '\') !important; }';
    if (assets.ornamen) css += '.panel-ornamen-bg { background-image: url(\'' + assets.ornamen + '\') !important; }';
    style.innerHTML = css;
    document.head.appendChild(style);
  }

  function injectBgImages() {
    if (document.getElementById('bg-image-style')) return;
    if (__heavyAssets) { applyBgImages(__heavyAssets); return; }
    if (__heavyAssetsLoading) return;
    __heavyAssetsLoading = true;
    api('getDecorativeAssets').then(function (assets) {
      __heavyAssets = assets || {};
      __heavyAssetsLoading = false;
      // Hormati state toggle terkini (user bisa mematikan sebelum fetch selesai).
      if (localStorage.getItem('portal_show_bg_images') !== 'false') applyBgImages(__heavyAssets);
    }).catch(function () {
      __heavyAssetsLoading = false;
    });
  }
  function removeBgImages() {
    var existing = document.getElementById('bg-image-style');
    if (existing) existing.remove();
  }
  function initBgImages() {
    if (localStorage.getItem('portal_show_bg_images') !== 'false') injectBgImages();
  }

  document.addEventListener('DOMContentLoaded', init);

  function init() {
    const activeTheme = localStorage.getItem('portal_theme') || 'sleek';
    document.documentElement.className = 'theme-' + activeTheme;

    if (activeTheme === 'custom') {
      const customColors = JSON.parse(localStorage.getItem('portal_custom_colors') || '{"kepemimpinan":"#10B981","latsar":"#F43F5E","teknis":"#F59E0B","lain":"#8B5CF6"}');
      
      // hexToRgb & shadeColor: helper global bersama di ClientUtils.html.
      let styleEl = document.createElement('style');
      styleEl.id = 'custom-theme-style';
      styleEl.setAttribute('data-custom-theme', 'true');
      
      const cats = ['kepemimpinan', 'latsar', 'teknis', 'lain'];
      let cssText = '.theme-custom {';
      cats.forEach(c => {
        const base = customColors[c];
        const start = shadeColor(base, 20);
        const text = shadeColor(base, -40);
        cssText += `
          --color-${c}-start: ${start};
          --color-${c}-end: ${base};
          --color-${c}-border: ${shadeColor(base, -20)};
          --color-${c}-rgb: ${hexToRgb(base)};
          --color-${c}-text: ${text};
        `;
      });
      cssText += '}';
      styleEl.innerHTML = cssText;
      document.head.appendChild(styleEl);
    }

    const logoImg = document.getElementById('brand-logo-img');
      if (typeof ASSETS !== 'undefined') {
        if (logoImg) logoImg.src = ASSETS.logo;
        if (logoImg) {
          logoImg.addEventListener('click', function() {
            var on = localStorage.getItem('portal_show_bg_images') !== 'false';
            localStorage.setItem('portal_show_bg_images', on ? 'false' : 'true');
            if (on) removeBgImages(); else injectBgImages();
          });
        }
        if (ASSETS.logoSosmed) {
          const wm = document.getElementById('watermark-logo-sosmed');
          if (wm) wm.src = ASSETS.logoSosmed;
        }
        initBgImages();
      }

    try {
      // GLOBAL CLICK DELEGATOR
      document.addEventListener('click', (e) => {
        // 1. Handle Dropdowns
        const dropdownBtn = e.target.closest('[data-action="toggle-dropdown"]');
        if (dropdownBtn) {
          e.stopPropagation();
          const menu = dropdownBtn.nextElementSibling;
          const card = dropdownBtn.closest('.tall-card');
          document.querySelectorAll('.sub-dropdown-menu.open').forEach(m => {
            if (m !== menu) {
              m.classList.remove('open');
              const c = m.closest('.tall-card');
              if (c) c.classList.remove('dropdown-open');
            }
          });
          if (menu) {
            const isOpen = menu.classList.toggle('open');
            if (card) card.classList.toggle('dropdown-open', isOpen);
          }
        } else {
          document.querySelectorAll('.sub-dropdown-menu.open').forEach(m => {
            m.classList.remove('open');
            const c = m.closest('.tall-card');
            if (c) c.classList.remove('dropdown-open');
          });
        }

        // 2. Handle generic data-action clicks
        const actionBtn = e.target.closest('[data-action]');
        if (actionBtn && actionBtn.dataset.action !== 'toggle-dropdown') {
          const action = actionBtn.dataset.action;
          
          if (action === 'submit-process' && typeof handleFinalize === 'function') {
            handleFinalize();
          } else if (action === 'save-draft-process' && typeof handleSaveDraft === 'function') {
            handleSaveDraft();
          }
        }
      });
      const sidebarToggle = document.getElementById('sidebar-toggle');
      const sidebarBackdrop = document.getElementById('sidebar-backdrop');
      const appShell = document.getElementById('app');
      if (sidebarToggle && sidebarBackdrop && appShell) {
        function closeSidebar() {
          appShell.classList.remove('sidebar-open');
          sidebarToggle.setAttribute('aria-expanded', 'false');
        }
        function toggleSidebar() {
          const isOpen = appShell.classList.toggle('sidebar-open');
          sidebarToggle.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
        }
        sidebarToggle.addEventListener('click', toggleSidebar);
        sidebarBackdrop.addEventListener('click', closeSidebar);
        document.querySelectorAll('.nav-item, .nav-child-item').forEach(function(el) {
          el.addEventListener('click', closeSidebar);
        });
        // GLOBAL KEYBOARD DELEGATOR
        document.addEventListener('keydown', function(e) {
          // 1. Sidebar Escape
          if (e.key === 'Escape' && appShell.classList.contains('sidebar-open')) closeSidebar();

          // 2. Escape Modal (ClientArchiveFolder / ClientTemplates)
          if (e.key === 'Escape') {
             const cancelBtn = document.querySelector('.modal [data-action="cancel"], .modal #doc-cancel-btn');
             if (cancelBtn && cancelBtn.offsetParent !== null) cancelBtn.click();
             
             if (state.view === 'archive_folder' && window._activeArchiveModalCleanup) {
               e.preventDefault();
               window._activeArchiveModalCleanup();
             }
          }

          // 3. Ctrl+Enter (Finalize Forms)
          if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
            const submitBtn = document.querySelector('#finalize-archive, #doc-submit-btn, #doc-submit-btn-modal');
            if (submitBtn && !submitBtn.disabled && submitBtn.offsetParent !== null) {
              e.preventDefault();
              submitBtn.click();
            } else if (state.view === 'archive_folder' && window._activeArchiveModalSubmit) {
              e.preventDefault();
              window._activeArchiveModalSubmit();
            }
          }

          // 4. Ctrl+S (Save Draft)
          if ((e.ctrlKey || e.metaKey) && e.key === 's') {
            const saveBtn = document.querySelector('#save-draft-btn');
            if (saveBtn && !saveBtn.disabled && saveBtn.offsetParent !== null) {
              e.preventDefault();
              saveBtn.click();
            }
          }
        });
      }

      document.querySelectorAll('.nav-item').forEach(button => {
        if (button.id === 'nav-kegiatan') {
          button.addEventListener('click', () => {
            const parent = document.getElementById('nav-kegiatan-group');
            if (parent) {
              const isExpanded = parent.classList.toggle('expanded');
              localStorage.setItem('kegiatan_expanded', isExpanded ? '1' : '0');
            }
          });
        } else {
          button.addEventListener('click', () => {
            if (button.id === 'nav-process') {
              state.draft = null;
              state.draftPrompted = false;
              state.selectedFile = null;
              state.preselectedTargetFolderId = null;
              if (typeof clearProcessStateFromLocal === 'function') {
                clearProcessStateFromLocal();
              }
            }
            if (button.id === 'nav-document-process') {
              if (state.view === 'archive_folder' && state.selectedActivityId) {
                state.preselectedActivityId = state.selectedActivityId;
                state.preselectedSubActivityId = state.selectedSubActivityId || null;
              } else if (state.view === 'activity_detail' && state.selectedActivityId) {
                state.preselectedActivityId = state.selectedActivityId;
                state.preselectedSubActivityId = null;
              } else {
                state.preselectedActivityId = null;
                state.preselectedSubActivityId = null;
              }
            }
            if (button.id === 'nav-templates') {
              state.templateActiveCategoryId = '';
            }
            if (button.dataset.view) {
              setView(button.dataset.view);
            }
          });
        }
      });
  } catch (e) {
    console.error('init nav error:', e);
  }

  initializeApplication();
  setTimeout(bindSearchBar, 100);
}

</script>
