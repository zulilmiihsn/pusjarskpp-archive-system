<script>
  async function renderAccounts(isSilentUpdate) {
    const rid = currentRenderId();
    const isModalOpen = Array.from(document.querySelectorAll('.modal-backdrop')).some(el => el && el.style.display !== 'none' && el.style.display !== '');
    if (isSilentUpdate && isModalOpen) return;

    const cached = isViewCacheValid('accounts') ? getCachedView('accounts') : null;
    
    if (cached) {
      const wrap = document.getElementById('accounts-table-wrap');
      if (isSilentUpdate && wrap) {
        wrap.innerHTML = accountsTable(cached.data.items || [], cached.data);
        bindAccountTableActions();
      } else {
        setContent(accountsPageHtml(cached.data.items || [], cached.data));
        bindAccountEvents();
        bindAccountTableActions();
      }
    } else if (!isSilentUpdate) {
      showLoading('Memuat data akun...');
    }

    try {
      const result = await getCachedOrFetch('accounts_' + currentAccountPage, null, function () {
        return api('listAccounts', { page: currentAccountPage, pageSize: 50 });
      });
      if (rid !== currentRenderId()) return;

      if (isSilentUpdate && isModalOpen) return;

      if (result.source === 'fresh') {
        setContent(accountsPageHtml(result.data.items || [], result.data));
        bindAccountEvents();
        bindAccountTableActions();
      } else if (result.source === 'stale-revalidated') {
        const wrap = document.getElementById('accounts-table-wrap');
        if (wrap) {
          wrap.innerHTML = accountsTable(result.data.items || [], result.data);
          bindAccountTableActions();
        } else {
          setContent(accountsPageHtml(result.data.items || [], result.data));
          bindAccountEvents();
          bindAccountTableActions();
        }
      }
    } catch (error) {
      if (rid !== currentRenderId()) return;
      if (!isSilentUpdate) {
        setContent('<div class="error" style="margin:22px;">' + esc(errorMessage(error)) + '</div>');
      }
    }
  }

  let currentAccountPage = 1;

  function accountsPageHtml(rows, meta) {
    return `
      <div class="accounts-page">
        ${pageCardHtml({
          title: 'Manajemen Akun',
          subtitle: 'Kelola akun pengguna yang memiliki akses ke sistem.',
          icon: iconSvg('account'),
          actions: '<button class="btn btn-primary" id="add-account-btn">' + iconSvg('plus') + 'Tambah Akun</button>',
          body: '<div id="accounts-table-wrap">' + accountsTable(rows || [], meta) + '</div>',
          extraClass: 'accounts-page-card'
        })}
      </div>
      ` + accountModalHtml();
  }

  function accountModalHtml() {
    return `
      <div id="account-modal" class="modal-backdrop" style="display:none;">
        <div class="modal-card acc-modal-card">
          <div class="acc-modal-bar"></div>
          <div class="acc-modal-head">
            <div class="acc-modal-head-left">
              <div class="acc-modal-head-icon" id="acc-modal-head-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                  <circle cx="8.5" cy="7" r="4"/>
                  <line x1="20" y1="8" x2="20" y2="14"/>
                  <line x1="23" y1="11" x2="17" y2="11"/>
                </svg>
              </div>
              <div>
                <h3 class="acc-modal-title" id="account-modal-title">Tambah Akun</h3>
                <p class="acc-modal-sub" id="account-modal-sub">Buat akun baru untuk pengguna.</p>
              </div>
            </div>
            <button class="acc-modal-close" id="account-modal-close" aria-label="Tutup">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
              </svg>
            </button>
          </div>
          <div class="acc-modal-body">
            <div class="acc-field-group">
              <div class="acc-field-row">
                <div class="acc-field">
                  <label class="acc-label" for="acc-username">Nama Pengguna <span class="required-dot">*</span></label>
                  <div class="acc-input-wrap">
                    <svg class="acc-input-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                    <input id="acc-username" type="text" autocomplete="off" placeholder="user@latbang">
                  </div>
                </div>
                <div class="acc-field">
                  <label class="acc-label">Nama Tampilan</label>
                  <div class="acc-input-wrap">
                    <svg class="acc-input-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                    <input id="acc-display-name" type="text" autocomplete="off" placeholder="User Latbang">
                  </div>
                </div>
              </div>
            </div>
            <div class="acc-modal-divider"><span>Akses</span></div>
            <div class="acc-field-group">
              <label class="acc-label" style="margin-bottom:8px;">Role <span class="required-dot">*</span></label>
              <div class="acc-role-grid" id="acc-role-grid">
                <div class="acc-role-card" data-role="admin">
                  <div class="acc-role-card-icon acc-role-card-icon-admin"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg></div>
                  <div class="acc-role-card-body"><strong>Admin</strong><span>Akses penuh ke seluruh sistem</span></div>
                  <div class="acc-role-check"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></div>
                </div>
                <div class="acc-role-card selected" data-role="user">
                  <div class="acc-role-card-icon acc-role-card-icon-user"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></div>
                  <div class="acc-role-card-body"><strong>Pengguna</strong><span>Akses arsip &amp; dokumen saja</span></div>
                  <div class="acc-role-check"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></div>
                </div>
              </div>
            </div>
            <div class="acc-modal-divider"><span>Keamanan</span></div>
            <div class="acc-field-group">
              <div class="acc-field">
                <label class="acc-label" for="acc-password" id="acc-password-label">
                  <span>Kata Sandi <span class="required-dot" id="acc-password-required">*</span></span>
                  <span class="acc-password-hint" id="acc-password-hint">min. 6 karakter</span>
                </label>
                <div class="acc-input-wrap">
                  <svg class="acc-input-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                  <input id="acc-password" type="password" placeholder="min. 6 karakter">
                  <button class="acc-pw-toggle" id="acc-pw-toggle" type="button" tabindex="-1" aria-label="Tampilkan kata sandi">
                    <svg class="acc-pw-eye" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                    <svg class="acc-pw-eye-off" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
                  </button>
                </div>
              </div>
            </div>
            <div class="acc-modal-avatar-preview" id="acc-avatar-preview">
              <div class="acc-preview-ring"><div class="acc-preview-initial" id="acc-preview-initial">?</div></div>
              <div class="acc-preview-text"><strong id="acc-preview-name">Nama Pengguna</strong><span id="acc-preview-username">username</span></div>
            </div>
          </div>
          <div class="acc-modal-foot">
            <button class="btn" id="account-modal-cancel" style="padding:9px 20px;">Batal</button>
            <button class="acc-btn-save" id="account-modal-submit">
              <svg class="acc-btn-save-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
              <span>Simpan Akun</span>
              <div class="acc-btn-spinner" id="acc-btn-spinner"><div class="acc-spinner-dot"></div><div class="acc-spinner-dot"></div><div class="acc-spinner-dot"></div></div>
            </button>
          </div>
        </div>
      </div>
    `;
  }

  function accountsTable(rows, meta) {
    if (!rows.length) {
      return `
        <div class="accounts-empty">
          <div class="accounts-empty-icon">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
              <circle cx="8.5" cy="7" r="4"/>
              <line x1="20" y1="8" x2="20" y2="14"/>
              <line x1="23" y1="11" x2="17" y2="11"/>
            </svg>
          </div>
          <strong>Belum ada akun</strong>
          <p>Klik "Tambah Akun" untuk membuat akun pertama.</p>
        </div>
      `;
    }

    const admins = rows.filter(r => r.role === 'admin');
    const users = rows.filter(r => r.role !== 'admin');
    const sections = [];

    if (admins.length) {
      sections.push({ label: 'Administrator', icon: 'shield', count: admins.length, rows: admins, cls: 'admin' });
    }
    if (users.length) {
      sections.push({ label: 'Pengguna', icon: 'users', count: users.length, rows: users, cls: 'user' });
    }

    let paginationHtml = '';
    if (meta && meta.totalPages > 1) {
      paginationHtml = `
        <div class="pagination-controls mt-6 flex justify-between" style="align-items: center; border-top: 1px solid var(--border); padding-top: 12px;">
          <span class="muted small">Halaman ${meta.page} dari ${meta.totalPages} (Total: ${meta.total})</span>
          <div class="flex gap-2">
            <button class="btn btn-sm btn-outline acc-page-btn" data-page="${meta.page - 1}" ${meta.page <= 1 ? 'disabled' : ''}>Prev</button>
            <button class="btn btn-sm btn-outline acc-page-btn" data-page="${meta.page + 1}" ${meta.page >= meta.totalPages ? 'disabled' : ''}>Next</button>
          </div>
        </div>
      `;
    }

    return sections.map(section => `
      <div class="acc-section">
        <div class="acc-section-head acc-section-head-${section.cls}">
          <div class="acc-section-head-left">
            ${section.cls === 'admin' ? `
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
            </svg>
            ` : `
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
              <circle cx="9" cy="7" r="4"/>
              <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
              <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
            </svg>
            `}
            <span>${section.label}</span>
          </div>
          <span class="acc-section-count">${section.count}</span>
        </div>
        <div class="acc-section-body">
          ${section.rows.map(row => {
            const initial = (row.display_name || row.username || '?')[0].toUpperCase();
            return `
            <div class="acc-row">
              <div class="acc-row-left">
                <div class="accounts-avatar accounts-avatar-${row.role === 'admin' ? 'admin' : 'user'}">${esc(initial)}</div>
                <div class="acc-row-info">
                  <div class="acc-row-name-row">
                    <strong class="accounts-user-name">${esc(row.username)}</strong>
                    <span class="acc-row-ts">${esc(formatDateTime(row.created_at))}</span>
                  </div>
                  <span class="accounts-user-display">${esc(row.display_name || row.username)}</span>
                </div>
              </div>
              <div class="acc-row-right">
                <button class="acc-row-btn edit-account-btn" title="Edit" data-account-id="${esc(row.account_id)}" data-username="${esc(row.username)}" data-role="${esc(row.role || 'user')}" data-display-name="${esc(row.display_name || '')}">
                  <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
                    <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
                  </svg>
                </button>
                <button class="acc-row-btn acc-row-btn-danger delete-account-btn" title="Nonaktifkan" data-account-id="${esc(row.account_id)}" data-username="${esc(row.username)}">
                  <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
                  </svg>
                </button>
              </div>
            </div>
          `}).join('')}
        </div>
      </div>
    `).join('') + paginationHtml;
  }

  function bindAccountEvents() {
    document.getElementById('add-account-btn')?.addEventListener('click', () => {
      openAccountModal(null);
    });

    const modal = document.getElementById('account-modal');
    const cancel = document.getElementById('account-modal-cancel');
    const close = document.getElementById('account-modal-close');
    const closeModal = () => { hideElementAnimated(modal); };
    cancel?.addEventListener('click', closeModal);
    close?.addEventListener('click', closeModal);
    modal?.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });

    document.querySelectorAll('.acc-role-card').forEach(card => {
      card.addEventListener('click', () => {
        document.querySelectorAll('.acc-role-card').forEach(c => c.classList.remove('selected'));
        card.classList.add('selected');
        updateAccAvatarPreview();
      });
    });

    const pwToggle = document.getElementById('acc-pw-toggle');
    const pwInput = document.getElementById('acc-password');
    pwToggle?.addEventListener('click', () => {
      const isPw = pwInput.type === 'password';
      pwInput.type = isPw ? 'text' : 'password';
      pwToggle.querySelector('.acc-pw-eye').style.display = isPw ? 'none' : '';
      pwToggle.querySelector('.acc-pw-eye-off').style.display = isPw ? '' : 'none';
    });
  }

  function updateAccAvatarPreview() {
    const el = document.getElementById('acc-avatar-preview');
    const nameEl = document.getElementById('acc-preview-name');
    const userEl = document.getElementById('acc-preview-username');
    const initialEl = document.getElementById('acc-preview-initial');
    if (!el) return;
    const u = document.getElementById('acc-username')?.value?.trim() || '';
    const d = document.getElementById('acc-display-name')?.value?.trim() || u;
    const r = document.querySelector('.acc-role-card.selected')?.dataset?.role || 'user';
    nameEl.textContent = d || 'Nama Pengguna';
    if (userEl) userEl.textContent = u || 'username';
    initialEl.textContent = d ? d[0].toUpperCase() : '?';
    el.classList.toggle('has-value', !!d);
  }

  let _currentEditAccountId = null;
  let _originalUsername = null;

  function openAccountModal(account) {
    const modal = document.getElementById('account-modal');
    const title = document.getElementById('account-modal-title');
    const sub = document.getElementById('account-modal-sub');
    const username = document.getElementById('acc-username');
    const displayName = document.getElementById('acc-display-name');
    const password = document.getElementById('acc-password');
    const submit = document.getElementById('account-modal-submit');
    const passwordRequired = document.getElementById('acc-password-required');
    const passwordHint = document.getElementById('acc-password-hint');
    const spinner = document.getElementById('acc-btn-spinner');
    const headIcon = document.getElementById('acc-modal-head-icon');
    const roleCards = document.querySelectorAll('.acc-role-card');

    const updatePasswordRequirement = () => {
      if (_currentEditAccountId) {
        const uChanged = username.value.trim().toLowerCase() !== _originalUsername.toLowerCase();
        if (uChanged) {
          if (passwordRequired) passwordRequired.style.display = 'inline';
          if (passwordHint) {
            passwordHint.textContent = 'Wajib diisi karena username diubah';
            passwordHint.style.color = 'var(--error, #e5484d)';
          }
          password.placeholder = 'Wajib diisi (min. 6 karakter)';
        } else {
          if (passwordRequired) passwordRequired.style.display = 'none';
          if (passwordHint) {
            passwordHint.textContent = 'Kosongkan jika tidak diubah';
            passwordHint.style.color = '';
          }
          password.placeholder = 'Kosongkan jika tidak diubah';
        }
      }
    };

    username.oninput = () => {
      updatePasswordRequirement();
      updateAccAvatarPreview();
    };

    displayName.oninput = updateAccAvatarPreview;

    if (account) {
      _currentEditAccountId = account.accountId;
      _originalUsername = account.username;
      title.textContent = 'Edit Akun';
      sub.textContent = 'Ubah data akun "' + account.username + '".';
      username.value = account.username;
      displayName.value = account.displayName;
      password.placeholder = 'Kosongkan jika tidak diubah';
      password.value = '';
      if (passwordRequired) passwordRequired.style.display = 'none';
      if (passwordHint) {
        passwordHint.textContent = 'Kosongkan jika tidak diubah';
        passwordHint.style.color = '';
      }
      if (headIcon) headIcon.innerHTML = `
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
          <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
        </svg>
      `;
      submit.innerHTML = `
        <svg class="acc-btn-save-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"/>
        </svg>
        <span>Simpan Perubahan</span>
        <div class="acc-btn-spinner" id="acc-btn-spinner">
          <div class="acc-spinner-dot"></div>
          <div class="acc-spinner-dot"></div>
          <div class="acc-spinner-dot"></div>
        </div>
      `;

      roleCards.forEach(c => {
        c.classList.toggle('selected', c.dataset.role === (account.role || 'user'));
      });
    } else {
      _currentEditAccountId = null;
      _originalUsername = null;
      title.textContent = 'Tambah Akun';
      sub.textContent = 'Buat akun baru untuk pengguna.';
      username.value = '';
      displayName.value = '';
      password.placeholder = 'min. 6 karakter';
      password.value = '';
      if (passwordRequired) passwordRequired.style.display = 'inline';
      if (passwordHint) {
        passwordHint.textContent = 'min. 6 karakter';
        passwordHint.style.color = '';
      }
      if (headIcon) headIcon.innerHTML = `
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
          <circle cx="8.5" cy="7" r="4"/>
          <line x1="20" y1="8" x2="20" y2="14"/>
          <line x1="23" y1="11" x2="17" y2="11"/>
        </svg>
      `;
      submit.innerHTML = `
        <svg class="acc-btn-save-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"/>
        </svg>
        <span>Simpan Akun</span>
        <div class="acc-btn-spinner" id="acc-btn-spinner">
          <div class="acc-spinner-dot"></div>
          <div class="acc-spinner-dot"></div>
          <div class="acc-spinner-dot"></div>
        </div>
      `;

      roleCards.forEach(c => {
        c.classList.toggle('selected', c.dataset.role === 'user');
      });
    }

    if (spinner) spinner.classList.remove('active');
    updateAccAvatarPreview();
    modal.classList.remove('is-closing');
    modal.style.display = 'grid';
    window.setTimeout(() => username.focus(), 50);

    submit.onclick = async () => {
      const u = username.value.trim();
      const p = password.value.trim();
      const r = document.querySelector('.acc-role-card.selected')?.dataset?.role || 'user';
      const d = displayName.value.trim();
      if (!u) { showToast('Nama pengguna wajib diisi.'); return; }
      
      if (_currentEditAccountId) {
        const uChanged = u.toLowerCase() !== _originalUsername.toLowerCase();
        if (uChanged) {
          if (!p) {
            showToast('Username diubah, silakan isi password baru.');
            return;
          }
          if (p.length < 6) {
            showToast('Kata sandi minimal 6 karakter.');
            return;
          }
        }
      } else {
        if (p.length < 6) {
          showToast('Kata sandi minimal 6 karakter.');
          return;
        }
      }

      // OPTIMISTIC UI: Instantly close modal and show toast
      hideElementAnimated(modal);
      const isEdit = !!_currentEditAccountId;
      const pt = showProcessToast(isEdit ? 'Menyimpan perubahan...' : 'Menambahkan akun...');
      
      // OPTIMISTIC EDIT: update text in DOM immediately
      if (isEdit) {
        const editBtn = document.querySelector(`.edit-account-btn[data-account-id="${_currentEditAccountId}"]`);
        if (editBtn) {
          const row = editBtn.closest('.acc-row');
          if (row) {
            const nameEl = row.querySelector('.accounts-user-name');
            const dispEl = row.querySelector('.accounts-user-display');
            if (nameEl) nameEl.textContent = u;
            if (dispEl) dispEl.textContent = d || u;
          }
        }
      }

      try {
        await api('saveAccount', {
          accountId: _currentEditAccountId || undefined,
          username: u,
          passwordHash: p || undefined,
          role: r,
          displayName: d || u
        });
        pt.success(isEdit ? 'Akun diperbarui.' : 'Akun baru ditambahkan.');
        // Silently reload in background
        loadAccountsTable();
      } catch (error) {
        pt.error('Gagal: ' + (errorMessage(error)));
        // Revert UI on failure: reopen modal
        modal.classList.remove('is-closing');
        modal.style.display = 'grid';
        submit.disabled = false;
        submit.classList.remove('loading');
        if (spinner) spinner.classList.remove('active');
      }
    };
  }

  function bindAccountTableActions() {
    document.querySelectorAll('.edit-account-btn').forEach(btn => {
      btn.addEventListener('click', () => openAccountModal(btn.dataset));
    });

    document.querySelectorAll('.delete-account-btn').forEach(button => {
      button.addEventListener('click', async () => {
        const username = button.dataset.username;
        if (!await showConfirmModal('Nonaktifkan akun "' + username + '"? Data tidak dihapus permanen.')) return;
        const pt = showProcessToast('Menonaktifkan akun "' + username + '"...');
        button.disabled = true;
        
        // OPTIMISTIC DELETE: Immediately hide the row
        const row = button.closest('.acc-row');
        let originalDisplay = '';
        if (row) {
          originalDisplay = row.style.display;
          row.style.display = 'none';
        }

        try {
          await api('deleteAccount', { accountId: button.dataset.accountId });
          pt.success('Akun "' + username + '" dinonaktifkan.');
          loadAccountsTable(currentAccountPage);
        } catch (error) {
          // Revert UI on failure
          if (row) row.style.display = originalDisplay;
          button.disabled = false;
          pt.error('Gagal: ' + (errorMessage(error)));
        }
      });
    });

    document.querySelectorAll('.acc-page-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const p = parseInt(btn.dataset.page);
        if (p) {
          currentAccountPage = p;
          loadAccountsTable(p);
        }
      });
    });
  }

  async function loadAccountsTable(pageToLoad) {
    const p = pageToLoad || currentAccountPage;
    try {
      const resp = await api('listAccounts', { page: p, pageSize: 50 });
      setCachedView('accounts_' + p, null, resp, getCurrentDataVersion());
      const wrap = document.getElementById('accounts-table-wrap');
      if (wrap) wrap.innerHTML = accountsTable(resp.items || [], resp);
      bindAccountTableActions();
    } catch (error) {
      showToast(errorMessage(error));
    }
  }
</script>
