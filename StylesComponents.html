<style>

  .archive-folder-card-info {
    display: flex;
    flex-direction: column;
    gap: 1px;
    min-width: 0;
  }

  .archive-folder-card-name {
    font-size: 13px;
    font-weight: 700;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    line-height: 1.35;
  }

  .archive-folder-card-sub {
    font-size: 11px;
    color: var(--muted);
    font-weight: 500;
  }

  .archive-folder-card-actions {
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    display: flex;
    align-items: center;
    gap: 4px;
    opacity: 0.3;
    transition: opacity 120ms ease;
  }

  .archive-folder-card:hover .archive-folder-card-actions {
    opacity: 1;
  }

  .archive-child-list,
  .archive-file-list {
    display: grid;
    gap: 8px;
    margin-top: 14px;
  }

  .archive-file-list-scrollable {
    max-height: 536px;
    overflow-y: auto;
    padding: 8px;
    background: var(--surface-soft);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
  }

  .archive-file-list-scrollable::-webkit-scrollbar {
    width: 4px;
  }
  .archive-file-list-scrollable::-webkit-scrollbar-track {
    background: transparent;
  }
  .archive-file-list-scrollable::-webkit-scrollbar-thumb {
    background: var(--border);
    border-radius: 99px;
  }
  .archive-file-list-scrollable::-webkit-scrollbar-thumb:hover {
    background: var(--subtle);
  }

  .archive-list-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 10px;
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    background: var(--surface);
    overflow: hidden;
  }

  .archive-list-row:hover {
    background: var(--surface-soft);
    border-color: var(--accent-border);
  }

  .archive-row-main {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
    flex: 1;
    color: var(--text);
    text-align: left;
  }

  .archive-row-main:hover { text-decoration: none; }

  .archive-row-text {
    flex: 1;
    min-width: 0;
    overflow: hidden;
  }

  .archive-row-main strong {
    display: block;
    font-size: 13px;
    line-height: 1.25;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .archive-row-main small {
    display: block;
    color: var(--muted);
    font-size: 11px;
    line-height: 1.35;
    margin-top: 2px;
  }

  .template-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    box-shadow: 0 4px 20px -4px rgba(0, 0, 0, 0.04), 0 2px 8px -2px rgba(0, 0, 0, 0.02);
    transition: box-shadow 300ms cubic-bezier(0.2, 0.8, 0.2, 1), border-color 300ms ease, transform 300ms cubic-bezier(0.2, 0.8, 0.2, 1);
  }

  .template-card:hover {
    box-shadow: 0 16px 32px -4px rgba(0, 0, 0, 0.08), 0 8px 16px -4px rgba(0, 0, 0, 0.04);
    border-color: rgba(148, 163, 184, 0.3);
    transform: translateY(-4px) scale(1.005);
  }

  .template-card-accent {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
  }

  .template-card-pdf .template-card-accent { background: #DC2626; }
  .template-card-doc .template-card-accent { background: #2563EB; }
  .template-card-docx .template-card-accent { background: #1D4ED8; }
  .template-card-generic .template-card-accent { background: #9CA3AF; }

  .template-card-head {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    padding: 24px 24px 0 24px;
    gap: 12px;
  }

  .template-card-type {
    display: flex;
    align-items: center;
    gap: 12px;
    min-width: 0;
  }

  .template-card-icon {
    width: 40px;
    height: 48px;
    border-radius: 6px;
    display: grid;
    place-items: center;
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #fff;
    flex-shrink: 0;
    line-height: 1;
    box-shadow: 0 2px 6px rgba(0,0,0,0.12), inset 0 1px 0 rgba(255,255,255,0.2);
  }

  .template-card-pdf .template-card-icon { background: linear-gradient(135deg, #EF4444, #DC2626); }
  .template-card-doc .template-card-icon { background: linear-gradient(135deg, #3B82F6, #2563EB); }
  .template-card-docx .template-card-icon { background: linear-gradient(135deg, #2563EB, #1D4ED8); }
  .template-card-generic .template-card-icon { background: linear-gradient(135deg, #9CA3AF, #6B7280); }

  .template-card-badge {
    font-size: 11px;
    font-weight: 700;
    color: var(--muted);
    letter-spacing: 0.06em;
    white-space: nowrap;
    background: var(--surface-soft);
    padding: 4px 8px;
    border-radius: 4px;
  }

  .template-card-manage {
    display: flex;
    gap: 4px;
    opacity: 0;
    transform: translateX(4px);
    transition: opacity 200ms ease, transform 200ms cubic-bezier(0.2, 0.8, 0.2, 1);
    flex-shrink: 0;
  }

  .template-card:hover .template-card-manage {
    opacity: 1;
    transform: translateX(0);
  }

  .template-card-btn {
    width: 32px;
    height: 32px;
    border-radius: var(--radius);
    display: grid;
    place-items: center;
    color: var(--muted);
    background: transparent;
    border: 1px solid transparent;
    cursor: pointer;
    transition: background 150ms ease, color 150ms ease, border-color 150ms ease, transform 150ms ease;
    flex-shrink: 0;
  }

  .template-card-btn:hover {
    background: var(--surface-hover);
    color: var(--text);
    border-color: var(--border);
    transform: scale(1.05);
  }

  .template-card-btn-danger:hover {
    background: var(--danger-bg);
    color: var(--danger);
    border-color: var(--danger-border);
  }

  .template-card-body {
    padding: 20px 24px 24px;
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .template-card-name {
    font-size: 15px;
    font-weight: 700;
    color: var(--text-dark);
    line-height: 1.4;
    overflow-wrap: anywhere;
    word-break: break-all;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .template-card-size {
    font-size: 12px;
    color: var(--subtle);
    font-weight: 500;
    letter-spacing: 0.02em;
  }

  .template-card-foot {
    display: flex;
    gap: 12px;
    padding: 16px 24px;
    border-top: 1px solid var(--line);
    background: rgba(248, 250, 252, 0.4);
  }

  .template-card-foot .btn {
    flex: 1;
    font-size: 13px;
    font-weight: 600;
    padding: 10px 14px;
    box-shadow: none;
    border-radius: 6px;
    transition: transform 150ms ease, background 150ms ease, box-shadow 150ms ease;
  }

  .template-card-foot .btn:hover {
    transform: translateY(-1px);
  }

  .template-card-foot .btn-primary {
    box-shadow: 0 2px 4px rgba(29, 78, 216, 0.15);
  }

  .template-card-foot .btn-primary:hover {
    box-shadow: 0 4px 8px rgba(29, 78, 216, 0.25);
  }

  @media (max-width: 768px) {
    .template-grid {
      grid-template-columns: 1fr;
    }
  }

  .archive-row-icon {
    width: 34px;
    height: 34px;
    display: grid;
    place-items: center;
    border-radius: var(--radius);
    color: var(--accent);
    background: var(--accent-light);
    flex-shrink: 0;
  }

  .archive-row-icon.archive-row-icon-file {
    color: var(--muted);
    background: var(--surface-soft);
    border: 1px solid var(--border);
  }

  .archive-row-actions {
    display: flex;
    align-items: center;
    gap: 4px;
    flex-shrink: 0;
  }

  .archive-empty-block {
    display: grid;
    gap: 4px;
    margin-top: 14px;
    padding: 18px;
    border: 1px dashed var(--border);
    border-radius: var(--radius-md);
    background: var(--surface-soft);
    color: var(--muted);
  }

  .archive-empty-block strong {
    color: var(--text);
    font-size: 13px;
  }

  .archive-modal {
    position: fixed;
    inset: 0;
    z-index: 10000;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: rgba(15, 23, 42, 0.52);
    backdrop-filter: blur(4px);
  }

  .archive-modal-panel {
    width: min(440px, 100%);
    background: var(--surface);
    box-shadow: var(--shadow-md);
  }

  .process-layout {
    width: 100%;
    max-width: none;
    padding-bottom: 120px;
  }

  .process-target-context {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 14px 16px;
    margin-bottom: 20px;
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    background: var(--surface-soft);
  }

  .process-panel {
    display: grid;
    gap: 16px;
    padding: 20px 22px 22px;
  }

  .process-header {
    display: grid;
    gap: 3px;
  }

  .process-header .section-title {
    font-size: 18px;
    line-height: 1.2;
  }

  .process-header .section-subtitle {
    margin: 0;
  }

  .process-source-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 20px;
    align-items: start;
  }

  .process-controls-stack {
    display: grid;
    gap: 11px;
    align-content: start;
  }

  .process-selectors {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-top: 0;
  }

  .drive-link-field {
    margin-top: 0;
  }

  .drive-link-input {
    display: grid;
    grid-template-columns: 38px minmax(0, 1fr);
    align-items: center;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--surface);
    overflow: hidden;
    transition: border-color 140ms ease, box-shadow 140ms ease, background-color 140ms ease;
    min-height: 42px;
  }

  .drive-link-input:focus-within {
    border-color: var(--accent-mid);
    box-shadow: 0 0 0 3px rgba(59,130,246,0.15);
  }

  .drive-link-input:has(input:not(:placeholder-shown)) {
    border-color: #10B981;
    box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.12);
    background-color: rgba(16, 185, 129, 0.02);
  }

  .drive-link-input:has(input:not(:placeholder-shown)) svg {
    color: #10B981;
  }

  .drive-link-input:focus-within:has(input:not(:placeholder-shown)) {
    border-color: #059669;
    box-shadow: 0 0 0 3px rgba(5, 150, 105, 0.2);
    background-color: rgba(16, 185, 129, 0.04);
  }

  .drive-link-input svg {
    width: 17px;
    height: 17px;
    justify-self: center;
    color: var(--subtle);
  }

  .drive-link-input input {
    border: 0;
    border-radius: 0;
    box-shadow: none;
    padding-left: 0;
    min-width: 0;
  }

  .drive-link-input input:focus {
    box-shadow: none;
  }

  .drive-link-field:has(input:disabled) {
    opacity: 0.45;
    pointer-events: none;
  }

  .drive-link-field.loading {
    opacity: 0.5;
    pointer-events: none;
    transition: opacity 0.2s;
  }

  .process-card.loading {
    position: relative;
  }

  .process-card.loading .form-grid {
    opacity: 0.4;
    pointer-events: none;
  }

  .process-card.loading::after {
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    width: 26px;
    height: 26px;
    margin: -13px 0 0 -13px;
    border: 3px solid var(--border, #d1d5db);
    border-top-color: var(--primary, #2563eb);
    border-radius: 50%;
    animation: doc-process-spin 0.7s linear infinite;
    z-index: 2;
  }

  @keyframes doc-process-spin {
    to { transform: rotate(360deg); }
  }

  .process-divider {
    border: 0;
    border-top: 1px solid var(--border);
    margin: 16px 0 10px 0;
  }

  .settings-folder-picker-card {
    background: var(--surface-soft);
    border: 1px dashed var(--border);
    border-radius: var(--radius-md);
    padding: 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    transition: border-color 140ms ease, background-color 140ms ease;
    cursor: pointer;
  }

/*  */
  .dropzone {
    border: 2px dashed var(--border);
    border-radius: var(--radius-lg);
    min-height: 196px;
    padding: 20px;
    background: var(--surface-soft);
    text-align: center;
    cursor: pointer;
    transition: border-color 180ms ease, background 180ms ease;
    margin-top: 0;
    display: grid;
    place-items: center;
  }
  .dropzone:hover {
    border-color: var(--accent-mid);
    background: var(--accent-light);
  }
  .dropzone-over {
    border-color: var(--accent);
    background: var(--accent-light);
    border-style: solid;
  }

  .dropzone-content {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    pointer-events: none;
  }

  .dropzone-icon {
    width: 34px;
    height: 34px;
    color: var(--subtle);
    stroke-width: 1.5;
  }
  .dropzone-over .dropzone-icon {
    color: var(--accent-mid);
  }

  .dropzone-text {
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
    max-width: 100%;
    overflow-wrap: anywhere;
  }

  .dropzone-sub {
    font-size: 12px;
    color: var(--subtle);
  }

  .metadata-block {
    display: grid;
    gap: 13px;
    border-top: 1px solid var(--border);
    padding-top: 16px;
  }

  .metadata-header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 14px;
  }

  .metadata-grid {
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 12px 14px;
    align-items: start;
  }

  .metadata-block textarea {
    min-height: 86px;
  }

  .metadata-field-uraian_informasi_item {
    grid-column: 1 / -1;
  }

  .metadata-field-lokasi_simpan {
    grid-column: 1 / -1;
  }

  .finalize-bar {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    gap: 12px;
    align-items: end;
    border-top: 1px solid var(--line);
    padding-top: 14px;
  }

  .final-name-block {
    display: grid;
    gap: 5px;
    min-width: 0;
  }

  .finalize-bar .button-row {
    justify-content: flex-end;
    align-self: stretch;
    align-items: end;
  }

  .finalize-bar .btn-primary {
    min-height: 42px;
  }

  .finalize-bar .preview-name {
    padding: 8px 10px;
  }

/*  */
  .form-hint-inline {
    font-weight: 400;
    font-size: 11.5px;
    color: var(--subtle);
  }

  .mt-4  { margin-top: 4px; }
  .mt-6  { margin-top: 6px; }
  .mt-8  { margin-top: 8px; }
  .mt-10 { margin-top: 10px; }
  .mt-12 { margin-top: 12px; }

  .mt-0  { margin-top: 0; }

  .mb-10 { margin-bottom: 10px; }

  .mb-14 { margin-bottom: 14px; }
  .mb-16 { margin-bottom: 16px; }
  .mb-20 { margin-bottom: 20px; }
  .mb-24 { margin-bottom: 24px; }

  .mr-8  { margin-right: 8px; }

  .ml-auto { margin-left: auto; }

  .gap-8  { gap: 8px; }
  .gap-12 { gap: 12px; }
  .gap-16 { gap: 16px; }
  .gap-20 { gap: 20px; }

  .flex          { display: flex; }
  .flex-col      { flex-direction: column; }
  .flex-wrap     { flex-wrap: wrap; }
  .items-center  { align-items: center; }
  .items-start   { align-items: flex-start; }
  .items-end     { align-items: flex-end; }
  .justify-between { justify-content: space-between; }
  .justify-end   { justify-content: flex-end; }
  .justify-center { justify-content: center; }

  .w-full { width: 100%; }

  .overflow-hidden { overflow: hidden; }

  .self-stretch { align-self: stretch; }

  .empty-sm { padding: 24px; }

  .nav-admin { display: flex; }

  /* SEARCH BAR (GLOBAL, HEADER) */

  .search-bar {
    position: relative;
    width: 340px;
    min-width: 0;
    margin: 0;
  }

  .search-bar-icon {
    position: absolute;
    left: 11px;
    top: 50%;
    transform: translateY(-50%);
    width: 15px;
    height: 15px;
    color: var(--subtle);
    pointer-events: none;
  }

  .search-bar-input {
    width: 100%;
    min-height: 36px;
    height: 36px;
    padding: 6px 12px 6px 32px;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: var(--surface-soft);
    font-size: 13px;
    transition: border-color 140ms ease, box-shadow 140ms ease, background 140ms ease;
  }

  .search-bar-input:focus {
    outline: none;
    border-color: var(--accent-mid);
    box-shadow: 0 0 0 3px rgba(59,130,246,0.12);
    background: var(--surface);
  }

  .search-bar-input::placeholder {
    color: var(--subtle);
  }

  .search-dropdown {
    display: none;
    position: absolute;
    top: calc(100% + 6px);
    left: 0;
    right: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    box-shadow: var(--shadow-md);
    z-index: 100;
    max-height: 360px;
    overflow-y: auto;
    padding: 6px;
  }

  .search-dropdown.open { display: block; animation: fadeSlide 140ms ease; }

  .dropdown-header {
    padding: 6px 12px 4px;
    font-size: 11.5px;
    font-weight: 700;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  .sub-dropdown-item {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    text-align: left;
    padding: 8px 12px;
    background: none;
    border: none;
    cursor: pointer;
    border-radius: var(--radius);
    font-size: 13px;
    font-weight: 500;
    color: var(--text);
    transition: background 100ms ease;
  }

  .search-dropdown-item {
    display: block;
    width: 100%;
    text-align: left;
    padding: 9px 10px;
    border-radius: var(--radius);
    cursor: pointer;
    transition: background 100ms ease;
  }

  .search-dropdown-item:hover { background: var(--surface-soft); }

  .search-dropdown-group-header {
    font-size: 10px;
    font-weight: 800;
    color: var(--accent-mid);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    padding: 8px 10px 4px 10px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 4px;
    opacity: 0.85;
  }

  .search-dropdown-group-header:not(:first-child) {
    margin-top: 10px;
  }

  .search-dropdown-item-content {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .search-item-type-icon {
    width: 15px;
    height: 15px;
    color: var(--subtle);
    flex-shrink: 0;
    transition: color 100ms ease;
  }

  .search-dropdown-item:hover .search-item-type-icon {
    color: var(--accent-mid);
  }

  .search-dropdown-text-group {
    display: flex;
    flex-direction: column;
    min-width: 0;
    flex: 1;
  }

  .search-dropdown-label {
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
    line-height: 1.3;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .search-dropdown-sublabel {
    font-size: 11px;
    font-weight: 500;
    color: var(--muted);
    margin-top: 1px;
  }

  .search-dropdown-empty {
    padding: 16px 10px;
    text-align: center;
    color: var(--muted);
    font-size: 13px;
    font-weight: 500;
  }

  .year-dropdown-container {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: flex-end;
  }

  .dropdown-container {
    position: relative;
  }
  
  .year-dropdown-menu {
    top: calc(100% + 4px);
    right: 0;
    min-width: 140px;
  }

/*  */

  .year-pill {
    cursor: pointer;
